<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#150F2C}
a{color:#F7A1C4}a:hover{color:#FFD0E3}
button,a{font:inherit;cursor:pointer;transition:transform .12s ease,filter .12s ease}
button{color:inherit}
button:active,a:active{transform:scale(.95);filter:brightness(1.2)}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1040px; position: relative; overflow: hidden; background: #0A0716; color: #ECEBFA; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px">
<div style="padding: 22px 16px; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; color: #3E3460">Blue holds</div>

<section role="dialog" aria-label="Edit project" style="position: absolute; left: 0; right: 0; bottom: 0; top: 70px; border-radius: 26px 26px 0 0; background: #221A44; border-top: 1px solid #4D3F84; padding: 10px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<span style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: #4D3F84"></span>
<div style="display: flex; align-items: flex-start; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px">Edit project</h2><span style="font-size: 13px; color: #ADA2D4">Cecilia · every field below can change</span></div>
<a href="Project.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 14px; background: #2D2357; color: #ECEBFA; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; text-decoration: none">×</a>
</div>

<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #ADA2D4">Name (optional)<input value="Blue holds" style="height: 46px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; border: 1px solid #4D3F84; background: #2D2357; color: #ECEBFA; font-weight: 600"></label>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #ADA2D4">Status</span>
<div role="group" aria-label="Status" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button aria-pressed="true" style="position: relative; height: 50px; border-radius: 14px; border: 3px solid #ECEBFA; background: #F7A1C4; color: #2A0F1C; font-weight: 800; box-shadow: 0 0 14px rgba(247,161,196,.5)">Open<span style="position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: #ECEBFA; color: #2A0F1C; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; border: 2px solid #221A44">✓</span></button>
<button style="height: 50px; border-radius: 14px; border: 1px solid #4D3F84; background: transparent; color: #8C82B0; font-weight: 600">Sent</button>
<button style="height: 50px; border-radius: 14px; border: 1px solid #4D3F84; background: transparent; color: #8C82B0; font-weight: 600">Route reset</button>
</div>
</div>

<div role="group" aria-label="Category" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<button style="height: 66px; border-radius: 14px; border: 2px solid #352A62; background: #2D2357; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #ADA2D4"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M4 25C3 17 8 9 15 8C22 7 28 13 28 20C28 25 25 27 20 27H9C6 27 4 27 4 25Z" fill="#fff" stroke="#1E2235" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="10" cy="14" r="1.8" fill="#FFC98A" stroke="#1E2235" stroke-width="1"></circle><circle cx="12" cy="19" r="1.4" fill="#1E2235"></circle><circle cx="20" cy="19" r="1.4" fill="#1E2235"></circle><path d="M14.8 21.6 Q16 22.8 17.2 21.6" fill="none" stroke="#1E2235" stroke-width="1.2" stroke-linecap="round"></path></svg>Boulder</button>
<button aria-pressed="true" style="height: 66px; border-radius: 14px; border: 2px solid #F7A1C4; background: #3A1D3F; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: #ECEBFA"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><path d="M16 1V10" stroke="#1E2235" stroke-width="4" stroke-linecap="round"></path><path d="M16 1V10" stroke="#3DC2EC" stroke-width="2" stroke-linecap="round"></path><ellipse cx="16" cy="19" rx="10" ry="9" fill="#fff" stroke="#1E2235" stroke-width="1.6"></ellipse><circle cx="12" cy="18" r="1.4" fill="#1E2235"></circle><circle cx="20" cy="18" r="1.4" fill="#1E2235"></circle><path d="M14.8 20.6 Q16 21.8 17.2 20.6" fill="none" stroke="#1E2235" stroke-width="1.2" stroke-linecap="round"></path></svg>Top rope</button>
<button style="height: 66px; border-radius: 14px; border: 2px solid #352A62; background: #2D2357; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 600; color: #ADA2D4"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect x="14" y="23" width="4" height="8" rx="1.5" fill="#C4B8F5" stroke="#1E2235" stroke-width="1.3"></rect><rect x="5" y="4" width="22" height="20" rx="7" fill="#fff" stroke="#1E2235" stroke-width="1.6"></rect><circle cx="12" cy="15" r="1.4" fill="#1E2235"></circle><circle cx="20" cy="15" r="1.4" fill="#1E2235"></circle><path d="M14.8 17.6 Q16 18.8 17.2 17.6" fill="none" stroke="#1E2235" stroke-width="1.2" stroke-linecap="round"></path></svg>Auto belay</button>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #ADA2D4">Grade</span>
<div style="display: flex; gap: 6px">
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #4D3F84; background: transparent; color: #ADA2D4; font-weight: 600">5.10−</button>
<button aria-pressed="true" style="flex: 1; height: 44px; border-radius: 12px; border: 2px solid #ECEBFA; background: #4C3BCF; color: #fff; font-weight: 800">5.10+</button>
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #4D3F84; background: transparent; color: #ADA2D4; font-weight: 600">5.11−</button>
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #4D3F84; background: transparent; color: #ADA2D4; font-weight: 600">5.11+</button>
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #4D3F84; background: transparent; color: #ADA2D4; font-weight: 600">5.12−</button>
<button style="flex: 1; height: 44px; border-radius: 12px; border: 1px solid #4D3F84; background: transparent; color: #ADA2D4; font-weight: 600">5.12+</button>
</div>
</div>

<div style="display: flex; gap: 12px; align-items: stretch">
<svg viewBox="0 0 1227 1402" width="80" height="92" role="img" aria-label="Mini map: tap to move the pin">
<rect width="1227" height="1402" rx="60" fill="#000"></rect>
<g fill="#16161F" stroke="#5E5E78" stroke-width="10"><polygon points="852,18 1213,18 1032,198"></polygon><polygon points="1032,198 1213,18 1213,380"></polygon><polygon points="1155,829 1155,868 1104,917 1104,1010 1134,1040 1134,1207 1213,1207 1213,829"></polygon><polygon points="595,270 706,380 706,1087 595,1207 595,1137 568,1110 568,1027 624,970 624,792 646,771 646,707 627,707 627,514 595,482"></polygon><polygon points="12,732 98,732 98,815 125,815 125,957 98,957 98,1082 12,1082"></polygon></g>
<polygon points="595,270 807,270 872,335 872,433 774,531 774,793 820,838 820,920 769,970 769,1008 706,1008 706,380" fill="rgba(247,161,196,.3)" stroke="#F7A1C4" stroke-width="18"></polygon>
<circle cx="800" cy="860" r="64" fill="#F7A1C4" stroke="#000" stroke-width="14"></circle>
</svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #ADA2D4">Wall<button style="height: 42px; border-radius: 12px; border: 1px solid #4D3F84; background: #2D2357; text-align: left; padding: 0 12px; font-weight: 600; color: #ECEBFA">Upper ▾</button></label>
<label style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: #ADA2D4">Anchor #<input value="14" inputmode="numeric" style="width: 80px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 1px solid #4D3F84; background: #2D2357; color: #ECEBFA; text-align: center; font-weight: 700"></label>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #ADA2D4">Hold colour</span>
<div style="display: flex; gap: 8px">
<button aria-label="Yellow" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4D3F84; background: #F5D02E"></button>
<button aria-label="Pink" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4D3F84; background: #EE7FB0"></button>
<button aria-label="Blue, selected" aria-pressed="true" style="width: 38px; height: 38px; border-radius: 50%; border: 3px solid #ECEBFA; background: #2F6FD6; box-shadow: 0 0 0 3px #F7A1C4"></button>
<button aria-label="Green" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4D3F84; background: #3DA35D"></button>
<button aria-label="Orange" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4D3F84; background: #F08A24"></button>
<button aria-label="Red" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #4D3F84; background: #D83A34"></button>
<button aria-label="Black" style="width: 38px; height: 38px; border-radius: 50%; border: 2px solid #5E5E78; background: #22262A"></button>
</div>
</div>


<span style="font-size: 12px; color: #ADA2D4">Your logged tries keep their own date, result, note and video. Fix those from “Every try”.</span>

<div style="margin-top: auto; display: flex; gap: 10px">
<button style="height: 50px; padding: 0 16px; border-radius: 14px; border: 1px solid #8A3F38; background: transparent; color: #FF8A66; font-weight: 700">Delete</button>
<a href="Project.dc.html" style="flex: 1; height: 50px; border-radius: 14px; background: #F7A1C4; color: #2A0F1C; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; text-decoration: none">Save</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
