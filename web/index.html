<!doctype html>
<html lang="en" data-dark="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1622">
<meta name="color-scheme" content="dark only">
<title>Climb Buddy</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: single-column phone app — sticky header, scrolling view, fixed bottom tab bar, bottom sheets for details */
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --sunk:#E4E1D7; --ink:#1D2422; --muted:#5B6460; --line:#DCD8CD; --line2:#C9C4B8;
  --sent:#1F4FB8; --sent-ink:#FFFFFF; --sent-soft:#E2E9FA;
  --fell:#B44A14; --fell-soft:#FBEBDF; --fell-line:#E7B394; --fell-bar:#F2A36B;
  --rest:#2C4A96; --rest-soft:#E8EEFB; --rest-line:#A9BDEB; --rest-bar:#8FA9E6;
  --scrim:rgba(29,36,34,.5); --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.10);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"DM Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --tabh:64px; color-scheme:light;
}
/* Whose stats you're looking at tints the background: Gary green, Cecilia lavender, Both stays cream */
:root[data-who="green"]{--bg:#EDF5EB;--sunk:#D8E8D3;--line:#D3E2CE;--line2:#BBCEB5}
:root[data-who="lav"]{--bg:#F3EFFA;--sunk:#E2DAF2;--line:#DDD5EB;--line2:#C7BDDC}
body,.top{transition:background-color .25s ease}
:root.notrans body,:root.notrans .top{transition:none}
#view.slide-l{animation:slideL .2s ease-out}
#view.slide-r{animation:slideR .2s ease-out}
@keyframes slideL{from{transform:translateX(28px);opacity:.6}}
@keyframes slideR{from{transform:translateX(-28px);opacity:.6}}
/* person switcher: a big button per climber with their kawaii avatar; the picked one is filled in their colour (--pc) */
.wseg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px}
.wseg button{appearance:none;display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;border-radius:18px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-align:left;cursor:pointer;min-width:0;font:inherit;transition:background-color .15s,border-color .15s}
.wseg button svg{width:38px;height:38px;flex:none}
.wseg .nm{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.wseg .nm b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wseg .nm small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wseg button.hl{border-color:var(--pc);background:var(--pcs)}
.wseg button.hl small{color:var(--pc)}
.wseg.n3 button{gap:6px;padding:0 8px}
.wseg.n3 button svg{width:30px;height:30px}
/* kawaii category and result icons */
.cicon,.ricon{flex:none;display:inline-block;vertical-align:middle}
.ricon{width:28px;height:28px}
.cicon{width:20px;height:20px}
.types button .cicon{width:22px;height:22px;margin-right:4px}
/* ---------- dark mode, built on Gary's palette: indigo #402E7A, violet #4C3BCF, blue #4B70F5, cyan #3DC2EC,
   falls in light purple. Gary = deep teal-navy with cyan, Cecilia = deep plum with pink, Both = midnight indigo.
   --me is the person's colour; sends use it too. ---------- */
:root[data-dark]{color-scheme:dark;
  --bg:#100E22;--surface:#1B1838;--sunk:#252147;--ink:#ECEBFA;--muted:#A3A0C8;--line:#2C2752;--line2:#423B72;
  --accent:var(--me);--accent-ink:var(--me-ink);
  --me:#3DC2EC;--me-soft:#0F3346;--me-ink:#08202C;
  --sent:var(--me);--sent-ink:var(--me-ink);--sent-soft:var(--me-soft);
  --fell:#CDBFFB;--fell-ink:#2A1F5C;--fell-soft:#2B2550;--fell-line:#6E5FB8;--fell-bar:#CDBFFB;--chart-sent:#2A9FD0;
  --rest:#A193FA;--rest-soft:#2A2260;--rest-line:#5B4CC4;--rest-bar:#5B45D6;
  --scrim:rgba(4,3,14,.65);--shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.45)}
:root[data-dark][data-who="green"]{--bg:#0B1622;--surface:#132235;--sunk:#1B2E45;--line:#20364F;--line2:#34506E;--muted:#9DB2C8}
:root[data-dark][data-who="lav"]{--bg:#150F2C;--surface:#221A44;--sunk:#2D2357;--line:#352A62;--line2:#4D3F84;--muted:#ADA2D4;--me:#F7A1C4;--me-soft:#4A2142;--me-ink:#3A0F27;--chart-sent:#D9609A}
/* the name highlight, active tab and selected chips pop in cyan / violet */
:root[data-dark] .tab[aria-selected="true"]{color:var(--me)}
:root[data-dark] .tab[aria-selected="true"]::after{background:var(--me)}
:root[data-dark] .types button[aria-pressed="true"]{border-bottom-color:var(--me)}
:root[data-dark] .seg:not(.wseg) button[aria-pressed="true"],:root[data-dark] .chip[aria-pressed="true"],:root[data-dark] .pill input:checked+span{background:#4C3BCF;border-color:#4C3BCF;color:#fff}
:root[data-dark] .btn.primary{background:#4B70F5;border-color:#4B70F5;color:#fff}
:root[data-dark] .badge{color:var(--fell-ink)}
:root[data-dark] .check{accent-color:var(--me)}
:root[data-dark] .minimap,:root[data-dark] .mapwrap{background:#000;border-color:#26263A}
:root[data-dark] .mapbox{background:#000}
:root[data-dark] .zone.sel polygon{fill:rgba(255,196,77,.42);stroke:#FFC44D}
:root[data-dark] .sync.on::before{background:#3DC2EC}
@media (prefers-reduced-motion:reduce){#view.slide-l,#view.slide-r{animation:none}body,.top{transition:none}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:var(--sent)}
:focus-visible{outline:2px solid var(--sent);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.brand img{width:22px;height:22px;border-radius:6px;flex:none}
.gymbtn{appearance:none;border:0;background:none;padding:6px 0;cursor:pointer;font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1{font-family:var(--f-display);font-weight:700;font-size:27px;line-height:1.1;margin:2px 0 0;letter-spacing:-.01em}
.sync{appearance:none;border:0;background:none;cursor:pointer;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 0 3px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.on::before{background:#2E9E58}
.sync.bad::before{background:var(--fell)}

main{padding-top:14px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 40px);display:flex;flex-direction:column;gap:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{appearance:none;border:0;background:none;color:var(--muted);font:600 12px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;cursor:pointer}
.tab svg{width:30px;height:30px}
.tab:not([aria-selected="true"]) svg{opacity:.75}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.badge{position:absolute;top:7px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--fell);color:#fff;font-size:11px;font-weight:700;line-height:18px;font-variant-numeric:tabular-nums}

/* controls */
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:600 15px var(--f-body);padding:9px 14px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.send{background:var(--sent);border-color:var(--sent);color:var(--sent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.danger{color:var(--fell)}
.btn.small{min-height:36px;padding:5px 12px;font-size:14px;border-radius:10px}
.btn.wide{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.btn svg{width:18px;height:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:46px;width:100%}
textarea{resize:vertical}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.flabel{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg button{appearance:none;border:0;border-radius:10px;height:40px;background:transparent;color:var(--ink);font-weight:500;font-size:15px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.types{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border-bottom:1px solid var(--line)}
.types button{appearance:none;border:0;border-bottom:3px solid transparent;background:none;height:44px;color:var(--muted);font-weight:500;font-size:15px;cursor:pointer;white-space:nowrap}
.types button[aria-pressed="true"]{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:0 14px;height:38px;font:500 14px var(--f-body);white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.dayrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav{display:flex;align-items:center;gap:2px}
.iconbtn{appearance:none;width:40px;height:40px;border:0;border-radius:10px;background:none;color:var(--ink);cursor:pointer;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.iconbtn:disabled{opacity:.3;cursor:default}
.backfill{background:var(--fell-soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sum{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.sum div{display:flex;flex-direction:column;gap:1px;min-width:0}
.sum b{font-family:var(--f-display);font-size:26px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}
.sum b.s{color:var(--sent)} .sum b.f{color:var(--fell)} .sum b.r{color:var(--rest)}
.sum b.tops{font-size:16px;line-height:1.2;min-height:30px;display:flex;align-items:center}
.sum span{font-size:12px;color:var(--muted)}

/* ---------- press feedback: dip + brighten while held, then a quick ring as it lets go ---------- */
:root{--tap-ring:rgba(31,79,184,.38)}
:root[data-dark]{--tap-ring:rgba(61,194,236,.6)}
.tapping{transform:scale(.95)!important;filter:brightness(1.18);transition:transform .07s ease-out,filter .07s ease-out}
.tapped{animation:tapPop .42s ease-out}
@keyframes tapPop{0%{transform:scale(.95);filter:brightness(1.3);box-shadow:0 0 0 0 var(--tap-ring)}55%{filter:brightness(1.1);box-shadow:0 0 0 10px transparent}100%{transform:none;filter:none;box-shadow:0 0 0 0 transparent}}
.zone.tapping polygon,.zone.tapped polygon{filter:brightness(1.7)}
.zone.tapping,.zone.tapped{transform:none!important;animation:none;box-shadow:none}
@media (prefers-reduced-motion:reduce){.tapping{transform:none!important}.tapped{animation:tapFade .3s ease-out}@keyframes tapFade{0%{filter:brightness(1.3)}}}
/* session summary: a ring for the whole day + a stacked bar per climb type (shared scale).
   Chart colours are deeper than the UI's soft fills so they pass contrast and colour-blind checks. */
.sbar{display:flex;gap:2px;height:22px}
.sbar i{display:flex;align-items:center;justify-content:center;font:700 12.5px var(--f-body);font-style:normal;min-width:0;overflow:hidden;font-variant-numeric:tabular-nums}
.sbar i:first-child{border-radius:6px 0 0 6px}
.sbar i:last-child{border-radius:0 6px 6px 0}
.sbar i:only-child{border-radius:6px}
.sbar .none0{flex:1;height:6px;align-self:center;border-radius:3px;background:var(--sunk)}

/* Climb home */
.hcard{padding:12px;display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:12px}
.hmap{width:50%;max-width:210px;flex:none;border-radius:14px;overflow:hidden;background:#000}
.hmap svg{display:block;width:100%;height:auto}
.hstats{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hstats .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hstats .big{font:700 34px/1 var(--f-display)}
.hstats .big small{font-size:16px;font-weight:600}
.hstats .sbar{height:10px}
.hleg{display:flex;flex-direction:column;gap:4px;font-size:13px}
.hleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.hsm{font-size:12.5px;color:var(--muted)}
.hsm b{color:var(--ink)}
.hfoot{display:flex;align-items:center;gap:8px}
.hfoot .hsm{flex:1;min-width:0}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.shead h2{margin:0;font:700 19px var(--f-display)}
.atwall{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 4px 0 10px;border-radius:999px;background:#3A3016;border:1px solid #F5C451;color:#FBE3A6;font-size:12px;font-weight:600}
.atwall button{width:24px;height:24px;border-radius:50%;border:0;background:#5A4A1E;color:#FBE3A6;cursor:pointer;font-size:15px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{appearance:none;display:flex;align-items:center;gap:10px;height:84px;padding:0 12px;border-radius:20px;background:var(--surface);border:2px solid var(--line);color:var(--ink);text-align:left;cursor:pointer;font:inherit;min-width:0}
.tile.hi{border-color:#F5C451;background:var(--me-soft)}
.tile .nm{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tile b{font-size:16px}
.tile small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.hi small{color:#FBE3A6}
.cicon.big{width:48px;height:48px}
.cicon.md{width:30px;height:30px}
.clist{display:flex;flex-direction:column;gap:8px}
.crow2{display:flex;align-items:center;gap:10px;min-height:64px;padding:8px 12px;border-radius:16px;background:var(--surface)}
.crow2 .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;appearance:none;border:0;background:none;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.crow2 .t b{display:flex;align-items:center;gap:6px;font-weight:600;min-width:0}
.crow2 .t .w{font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow2 .t .d{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow2 .tm{font-size:12px;color:var(--muted);white-space:nowrap}
.hd{width:10px;height:10px;border-radius:50%;flex:none}
.vtile{width:44px;height:44px;border-radius:10px;background:var(--sunk);border:1px solid var(--line2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.btn.dashed{border-style:dashed;background:transparent;color:var(--muted)}
/* new climb picker: the chosen result is solid with a white outline and a tick badge, the rest are faded outlines */
.resrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.rbtn{appearance:none;position:relative;height:58px;border-radius:16px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:600 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;opacity:.7;cursor:pointer}
.rbtn .ricon{width:22px;height:22px}
.rbtn[aria-pressed="true"]{opacity:1;border:2px solid #fff;font-weight:700}
.rbtn[aria-pressed="true"]::after,.gchip[aria-pressed="true"]::after{content:"✓";position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;background:#fff;color:#1E2235;font-size:12px;font-weight:800;display:grid;place-items:center}
.rbtn[data-v="Sent"][aria-pressed="true"]{background:var(--me);color:var(--me-ink)}
.rbtn[data-v="Rested"][aria-pressed="true"]{background:#4C3BCF;color:#fff}
.rbtn[data-v="Fell"][aria-pressed="true"]{background:#CDBFFB;color:#2A1F5C}
.gchips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gchip{appearance:none;height:48px;border-radius:14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:700 15px var(--f-body);cursor:pointer;min-width:0;padding:0 4px}
/* log / edit panel: category buttons, chosen grade outlined in white with a tick, the rest fade */
.ccat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.cbtn{appearance:none;height:72px;border-radius:16px;border:1px solid var(--line2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 12px var(--f-body);color:var(--muted);opacity:.7;cursor:pointer;min-width:0}
.cbtn .cicon{width:36px;height:36px}
.cbtn[aria-pressed="true"]{opacity:1;border:2px solid var(--me);background:var(--me-soft);color:var(--ink);box-shadow:0 0 12px rgba(0,0,0,.35)}
.gchip{position:relative}
.gchips.picked .gchip:not([aria-pressed="true"]){opacity:.5}
.gchip[aria-pressed="true"]{border:3px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.3)}
.gchip[aria-pressed="true"]:not([style]){background:#4C3BCF;color:#fff}
:root[data-dark] .seg.cwho button[aria-pressed="true"]{background:var(--pcs);box-shadow:inset 0 0 0 2px var(--pc);border-color:transparent;color:var(--ink);font-weight:700}
:root[data-dark] .sw input:checked+span{box-shadow:0 0 0 3px var(--me);border-color:#fff}
.kgrid{display:grid;grid-template-columns:110px 1fr;gap:10px}
.vlist{display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:8px}
.vrow input{flex:1;min-width:0}
.vlist .btn{align-self:flex-start}
.plink{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--sunk)}
.plink .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.plink small{font-size:12.5px;color:var(--muted)}
/* full map wall panel */
.wprojs{display:flex;flex-direction:column}
.wrow{appearance:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:6px 0;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.wrow .t{flex:1;min-width:0;font-size:14px}
.mlegend .fl{display:inline-flex;align-items:center;gap:5px}

.datebar{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.datepick{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;font-weight:600;font-size:15px;cursor:pointer;border-radius:10px;white-space:nowrap}
.datepick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0;cursor:pointer}
.tag{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;white-space:nowrap;border-radius:10px;flex:none;font-variant-numeric:tabular-nums}
.tag.lg{min-width:64px;height:40px;padding:0 10px;font-size:16px}
.tag.md{height:30px;padding:0 10px;font-size:15px;border-radius:8px}
.tag.sm{height:24px;padding:0 7px;font-size:13px;border-radius:7px;min-width:42px}
.tag.plain{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* projects */
.cards{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.phead{display:flex;align-items:center;gap:12px;appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%}
.hdot{width:44px;height:44px;flex:none;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2)}
.hdot.sm{width:22px;height:22px;border-width:2px}
.hdot.none{background:repeating-linear-gradient(45deg,var(--sunk) 0 4px,transparent 4px 8px)}
.ptitle{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ptitle .l1{display:flex;align-items:center;gap:8px;min-width:0}
.ptitle .name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle .sub{font-size:13px;color:var(--muted)}
.pmeta{font-size:14px;display:flex;flex-direction:column;gap:3px}
.pmeta .m{color:var(--muted)}
.pmeta .note{font-style:italic;color:var(--muted)}
.sentmark{color:var(--sent);font-weight:700}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbtn{appearance:none;background:none;border:0;padding:6px 2px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:underline;cursor:pointer;align-self:flex-start}
.done{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.drow span.t{flex:1;min-width:0}
.sech{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}

/* progress */
.monthrow{display:flex;align-items:center;justify-content:space-between}
.month{display:flex;align-items:center;gap:2px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:1px;min-width:0}
.kpi b{font-family:var(--f-display);font-size:28px;line-height:1.2;font-weight:700;font-variant-numeric:tabular-nums}
.kpi b.small{font-size:19px;line-height:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:13px;color:var(--muted)}
.ctable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ctable th,.ctable td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
.ctable th:first-child,.ctable td:first-child{text-align:left}
.ctable th{font-size:12px;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:16px;font-weight:600}
.phead2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart{display:flex;gap:8px;align-items:flex-end;height:190px;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 24px;max-width:40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar .v{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.bar .stack{width:100%;display:flex;flex-direction:column;gap:2px}
.bar .stack i{display:block;border-radius:4px}
.bar .d{font-size:12px;color:var(--muted)}
.gbars{display:flex;flex-direction:column;gap:8px}
.gbar{display:flex;align-items:center;gap:10px}
.gbar .track{flex:1;height:18px;background:var(--sunk);border-radius:5px;overflow:hidden}
.gbar .track i{display:block;height:100%;border-radius:5px}
.gbar .n{min-width:92px;text-align:right;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.gbar .n b{color:var(--ink)}
.typeh{font-size:13px;font-weight:600;color:var(--muted);margin-top:4px}
.slist{display:flex;flex-direction:column}
.srow{appearance:none;border:0;border-bottom:1px solid var(--line);background:none;display:flex;align-items:center;gap:12px;padding:12px 0;text-align:left;cursor:pointer;width:100%}
.srow .dd{width:48px;display:flex;flex-direction:column;align-items:center;flex:none}
.srow .dd small{font-size:12px;color:var(--muted);text-transform:uppercase}
.srow .dd b{font-family:var(--f-display);font-size:21px;line-height:1.1}
.srow .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.srow .tx b{font-size:15px;font-weight:600}
.srow .tx span{font-size:13px;color:var(--muted)}
.srow svg{width:18px;height:18px;color:var(--muted);flex:none}

.empty{text-align:center;padding:28px 18px;color:var(--muted);border:1px dashed var(--line2);border-radius:16px;font-size:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.connect{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.connect h2{font-family:var(--f-display);margin:0;font-size:21px;line-height:1.2}
.connect p{margin:0;color:var(--muted)}
.err{color:var(--fell)!important}
.sheetlink{text-align:center;font-size:13px;color:var(--muted)}

/* bottom sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;background:var(--surface);width:100%;max-width:600px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;border-radius:24px 24px 0 0;padding:0 max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out;box-shadow:var(--shadow)}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:22px;max-height:88%}}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--surface);padding:18px 0 10px;z-index:1}
.sheet-h h2{font-family:var(--f-display);font-size:25px;line-height:1.15;margin:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sheet-h .sub{margin:4px 0 0;font-size:14px;color:var(--muted)}
.close{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer;flex:none}
.sheet form,.sheet .stack{display:flex;flex-direction:column;gap:18px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* radio pills + swatches */
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{position:relative}
.pill input,.sw input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;margin:0;pointer-events:none}
.pill span{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 15px;border-radius:21px;border:1px solid var(--line);background:var(--surface);font-size:14px;cursor:pointer;white-space:nowrap}
.pill input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.pill input:focus-visible+span,.sw input:focus-visible+span{outline:2px solid var(--sent);outline-offset:2px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{position:relative}
.sw span{display:block;width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.sw input:checked+span{box-shadow:0 0 0 3px var(--ink)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.stepper button{width:44px;height:40px;border:0;border-radius:10px;background:var(--surface);font-size:20px;cursor:pointer}
.stepper output{width:40px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.inrow{display:flex;align-items:center;justify-content:space-between;gap:16px}
.inrow input{width:120px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:19px}
.check{display:flex;align-items:center;gap:12px;background:var(--sent-soft);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:500;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--sent);flex:none}
.linkp{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.crow .t{flex:1;min-width:0;display:flex;flex-direction:column}
.crow .t b{font-weight:600;font-size:14px}
.crow .t span{font-size:13px;color:var(--muted)}
.res{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.res.s{color:var(--sent)} .res.f{color:var(--fell)} .res.r{color:var(--rest)}
.x{min-width:40px;height:40px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;border-radius:10px;flex:none}
.x[data-armed="1"]{font-size:13px;font-weight:700;color:var(--fell)}

/* map */
.mapwrap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;position:relative}
.mapbox{overflow:auto;border-radius:13px;max-height:74vh;-webkit-overflow-scrolling:touch}
.mapbox svg{display:block;width:calc(var(--mz,1) * 100%);height:auto}
.maprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.zoombtns{display:flex;gap:6px;flex:none}
.zoombtns button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:21px;line-height:1;cursor:pointer;color:var(--ink)}
.zoombtns button:disabled{opacity:.4}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav .pl{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:1px}
.pnav .pl b{font-weight:600;font-size:16px}
.pnav .pl small{font-size:12.5px;color:var(--muted)}
.psum{display:flex;flex-direction:column;gap:6px}
.psum .sbar{height:8px}
.psum p{margin:0;font-size:14px;font-variant-numeric:tabular-nums}
.zone{cursor:pointer;outline:none}
.zone polygon{transition:fill .15s}
.zone.sel polygon{fill:#FFD98A;stroke-width:12px}
.zone:focus-visible polygon{stroke:var(--sent);stroke-width:12px}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.mlegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line2)}
.mlegend i.dot{border-radius:50%;background:#8150C8;border:2px solid #2D3A34}
.ztype{font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;color:var(--ink)}
.minimap{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FBF8F1}
.minimap svg{display:block;width:100%;height:auto;max-height:320px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 12px);z-index:30;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;display:flex;gap:4px;align-items:center;width:max-content;max-width:calc(100% - 24px);font-size:14px;box-shadow:var(--shadow)}
.toast span{min-width:0;margin-right:6px}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;cursor:pointer;padding:8px 8px;white-space:nowrap}
.toast button.hi{text-decoration:underline;text-underline-offset:3px}
/* projects (redesign) */
.ph{font:700 24px var(--f-display)!important}
.pc2{appearance:none;display:flex;gap:12px;align-items:stretch;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:left;font:inherit;cursor:pointer;width:100%}
.pc2 .strip{width:8px;border-radius:4px;flex:none}
.pc2 .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pc2 .l1{display:flex;align-items:center;gap:8px;min-width:0}
.pc2 .l1 .cicon{width:30px;height:30px;flex:none}
.pc2 .name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc2 .sub,.pc2 .when{font-size:13px;color:var(--muted)}
.pc2 .when{font-size:12px;color:var(--me);font-weight:600}
.pc2 .note,.phero .note{font-size:13px;font-style:italic;color:var(--muted)}
.chev{width:28px;height:28px;flex:none;align-self:center;color:var(--muted)}
.tdots{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tdots small{margin-left:4px;font-size:12px;color:var(--muted)}
.tdot{width:12px;height:12px;border-radius:50%;display:inline-block}
.tdot.f{background:#CDBFFB}.tdot.r{background:#5B45D6}.tdot.s{background:var(--me)}
.dlink{appearance:none;border:0;background:none;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;flex:1;min-width:0}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pwho{display:flex;align-items:center;gap:6px;font-weight:700;color:var(--me);font-size:14px}
.pwho svg{width:26px;height:26px}
.phero{display:flex;gap:14px;align-items:center}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pg{display:flex;align-items:center;gap:10px}
.hball{width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);flex:none}
.pname{font:700 20px var(--f-display)}
.pw{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.pw .cicon{width:24px;height:24px;flex:none}
.pstat{align-self:flex-start;display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;background:var(--me-soft);color:var(--me);font-size:12px;font-weight:700}
.pstat.closed{background:var(--sunk);color:var(--muted)}
.pmap{width:108px;flex:none}
.pmap svg{width:100%;height:auto;display:block;border-radius:12px}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstats div{padding:10px;border-radius:16px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.pstats b{font:700 22px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstats small{font-size:12px;color:var(--muted)}
.qlog{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.qbtn{appearance:none;height:56px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:800 15px var(--f-body);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.qbtn .ricon{width:24px;height:24px}
.qbtn[data-v="Fell"]{background:#CDBFFB;border-color:#CDBFFB;color:#2A1F5C}
.qbtn[data-v="Rested"]{background:#2A2260;border-color:#5B4CC4;color:#C9C0FF}
.qbtn[data-v="Sent"]{background:var(--me);border-color:var(--me);color:var(--me-ink)}
.notes{display:flex;flex-direction:column;gap:8px}
.nrow{display:flex;align-items:flex-start;gap:6px;padding:10px 6px 10px 12px;border-radius:16px;background:var(--surface)}
.nrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.nrow small{font-size:12px;color:var(--muted)}
.nadd{display:flex;gap:8px}
.nadd input{flex:1;min-width:0;height:46px;box-sizing:border-box;padding:0 12px;border-radius:14px;border:1px dashed var(--line2);background:transparent;color:var(--ink);font:inherit}
.nadd .btn{width:46px;min-height:46px;font-size:20px}
.pfoot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ccat.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.rbtn.st[aria-pressed="true"]{background:var(--me);color:var(--me-ink)}
.shlist{display:flex;flex-direction:column;gap:6px}
.shrow{display:block;position:relative;cursor:pointer}
.shrow input{position:absolute;opacity:0;pointer-events:none}
.shrow>span{display:flex;align-items:center;gap:8px;min-height:52px;padding:6px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line2)}
.shrow .ricon{width:26px;height:26px;flex:none}.shrow .cicon{width:24px;height:24px;flex:none}
.shrow .w{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shrow small{font-size:11px;color:var(--muted);white-space:nowrap}
.shrow input:checked+span{border:2px solid #fff;background:var(--me-soft)}
.shrow input:focus-visible+span{outline:2px solid var(--me)}
</style>

(function(){

/* =====================================================================

const ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',

// Person avatars by theme: Gary a chalk bag (cyan band), Cecilia a hold with a pink bow
const AVATAR={
  green:`<path d="M8 10h16v14a5 5 0 0 1-5 5h-6a5 5 0 0 1-5-5z" fill="#fff" ${OL}/><rect x="7" y="6" width="18" height="5" rx="2.5" fill="#3DC2EC" ${OL}/>${face(17)}`,
  lav:`<path d="M6 18c0-7 5-12 11-12s9 5 9 11-4 10-10 10S6 24 6 18z" fill="#fff" ${OL}/><path d="M16 7l-5-3v6zM16 7l5-3v6z" fill="#F7A1C4" stroke="#1E2235" stroke-width="1.3" stroke-linejoin="round"/><circle cx="16" cy="7" r="1.6" fill="#F7A1C4" stroke="#1E2235" stroke-width="1.2"/>${face(17)}`
};

const PCOL={green:["#3DC2EC","#0F3346"],lav:["#F7A1C4","#4A2142"],both:["#A193FA","#2A2260"]};

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const todayKey=()=>dayKey(Date.now());
const keyDate=k=>{const p=k.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]||1,12);};

const fmtLong=k=>keyDate(k).toLocaleDateString([],{weekday:"long",month:"short",day:"numeric"});
const fmtShort=k=>keyDate(k).toLocaleDateString([],{month:"short",day:"numeric"});
const fmtDow=k=>keyDate(k).toLocaleDateString([],{weekday:"short"});
const relDay=k=>k===todayKey()?"today":k===shiftDay(todayKey(),-1)?"yesterday":fmtShort(k);
let backfillN=0;
function whenFor(k){if(k===todayKey())return Date.now();backfillN++;return keyDate(k).getTime()+backfillN*1000;}

/* ---------- types, lists, grades ---------- */
const TYPES=[
  {k:"Bouldering",grades:"Boulder grade",areas:["Boulder area"],anchor:false},
  {k:"Top rope",grades:"Rope grade",areas:["Rope area"],anchor:true},
  {k:"Auto belay",grades:"Rope grade",areas:["Auto belay area","Rope area"],anchor:true},
  {k:"Kilter Board",grades:"Kilter grade",areas:[],anchor:false}
];
const typeOf=k=>TYPES.find(t=>t.k===k)||TYPES[0];
function normType(v){const s=String(v||"").toLowerCase();if(/^boulder/.test(s))return"Bouldering";if(/^top/.test(s))return"Top rope";if(/^auto/.test(s))return"Auto belay";if(/^kilter/.test(s))return"Kilter Board";return String(v||"").trim()||"Bouldering";}
function listRows(name,anyGym){const rows=S.lists.filter(r=>eqi(r.list,name));if(anyGym)return rows;const g=rows.filter(r=>r.gym&&eqi(r.gym,GYM));return g.length?g:rows.filter(r=>!r.gym);}
const climbers=()=>{const c=[...new Set(listRows("Climber",true).map(r=>r.value))];return c.length?c:["Me"];};
const gyms=()=>{const g=[...new Set(listRows("Gym",true).map(r=>r.value))];if(GYM&&!g.some(x=>eqi(x,GYM)))g.unshift(GYM);return g;};
const gkey=g=>String(g==null?"":g).toLowerCase().replace(/[–—]/g,"-").replace(/\s+/g,"");
const gradeLabel=g=>String(g==null?"":g).replace(/(\d)\s*-\s*(\d)/g,"$1–$2");
const gradeRows=type=>listRows(typeOf(type).grades);
function areaRows(type){for(const n of typeOf(type).areas){const r=listRows(n);if(r.length)return r;}return[];}
const holdRows=()=>listRows("Hold colour",true);
function gradeIdx(type,g){const k=gkey(g);return gradeRows(type).findIndex(r=>gkey(r.value)===k);}
function gradeColour(type,g){const k=gkey(g);const r=gradeRows(type).find(x=>gkey(x.value)===k);return r&&/^#[0-9a-f]{6}$/i.test(r.colour)?r.colour:"";}
function inkOn(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const f=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);const L=.2126*f(r)+.7152*f(g)+.0722*f(b);return L>.3?"#1D2422":"#FFFFFF";}
function tagHTML(type,g,size){const c=gradeColour(type,g);const lbl=esc(gradeLabel(g));return c?`<span class="tag ${size}" style="background:${c};color:${inkOn(c)}">${lbl}</span>`:`<span class="tag ${size} plain">${lbl}</span>`;}
const CSSCOL={red:"#D83A34",orange:"#F08A24",yellow:"#F5D02E",green:"#3DA35D",teal:"#2BA5A0",blue:"#2F6FD6",purple:"#8150C8",pink:"#EE7FB0",black:"#22262A",white:"#F7F7F4",grey:"#9AA0A6",gray:"#9AA0A6",brown:"#8A5A3B"};
function holdHex(name){if(!name)return"";const r=holdRows().find(x=>eqi(x.value,name));if(r&&/^#[0-9a-f]{6}$/i.test(r.colour))return r.colour;return CSSCOL[String(name).trim().toLowerCase()]||"";}
function holdDot(name,cls){const h=holdHex(name);return h?`<span class="hdot ${cls||""}" style="background:${h}" aria-hidden="true"></span>`:`<span class="hdot none ${cls||""}" aria-hidden="true"></span>`;}
const RES_KEYS=[["Sent","sent","Sent"],["Rested","rest","Rested"],["Fell","fell","Fell"]];
// both sets pass the colour-blind / contrast validator on their own backgrounds
const RES_LIGHT={sent:"#1F4FB8",rest:"#6C8CEB",fell:"#DD6B26"},RES_DARK={sent:"#2A9FD0",rest:"#5B45D6",fell:"#CDBFFB"};
// Charts keep sent / rested / fell apart by lightness: mid sent (per person), deep violet rested, light purple fell
const CHART_SENT={green:"#2A9FD0",lav:"#D9609A",both:"#2A9FD0"};
let RES_HEX=RES_LIGHT;
function hardest(list){const out=[];for(const t of TYPES){let best=-1,bg="";for(const c of list){if(c.type!==t.k||c.result!=="Sent")continue;const i=gradeIdx(t.k,c.grade);if(i>best){best=i;bg=c.grade;}else if(best<0&&!bg)bg=c.grade;}if(bg)out.push(gradeLabel(bg));}return out.join(" · ");}

/* =====================================================================
   SYNC — the Google Sheet is the source of truth.
   Changes show on screen right away, then go to the sheet in batches.
   ===================================================================== */
const COLLS=["climbs","projects","notes","lists"];
let S={climbs:[],projects:[],notes:[],lists:[]};
let ready=false,auth="ok",KEY=LS.get("key",""),API=API_URL||LS.get("api",""),sheetUrl=LS.get("sheet",""),lastSync=0;
let queue=[],inflight=false,flushT=null,retryT=null;
let GYM=LS.get("gym",""),WHO=LS.get("who",""),DAY=todayKey(),TYPE=LS.get("type","Bouldering");
let projId=LS.get("projid","");
let tab=LS.get("tab","session"),projFilter="All",pMonth=todayKey().slice(0,7),BOTH=LS.get("both","")==="1";
function readLinkParams(){
  try{
    const h=new URLSearchParams((location.hash||"").replace(/^#/,""));const q=new URLSearchParams(location.search);
    const api=h.get("api")||q.get("api"),key=h.get("key")||q.get("key");
    if(api&&/^https:\/\/script\.google\.com\//.test(api)){API=api;LS.set("api",api);}
    if(key){KEY=key.trim();LS.set("key",KEY);}
    if(api||key)history.replaceState(null,"",location.pathname);
  }catch(e){}
}
function callApi(payload){return fetch(API,{method:"POST",body:JSON.stringify(payload),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});}
const uid=()=>("x"+Date.now().toString(36)+Math.random().toString(36).slice(2,9));
function applyLocal(o){const arr=S[o.coll];if(o.op==="add"){const rec=Object.assign({id:o.id},o.data);const i=arr.findIndex(d=>d.id===o.id);if(i>=0)arr[i]=rec;else arr.push(rec);}else if(o.op==="update"){const x=arr.find(d=>d.id===o.id);if(x)Object.assign(x,o.data);}else S[o.coll]=arr.filter(d=>d.id!==o.id);}
function enqueue(o){queue.push(o);applyLocal(o);onData();clearTimeout(flushT);flushT=setTimeout(flush,350);}
const store={
  add(c,data){const id=uid();enqueue({op:"add",coll:c,id,data});return id;},
  update(c,id,data){enqueue({op:"update",coll:c,id,data});},
  del(c,id){enqueue({op:"del",coll:c,id});}
};
function normalize(st){
  st=st||{};const str=v=>String(v==null?"":v).trim();
  return{
    lists:(st.lists||[]).map(r=>Object.assign({},r,{list:str(r.list),value:str(r.value),colour:str(r.colour),gym:str(r.gym)})),
    climbs:(st.climbs||[]).map(r=>Object.assign({},r,{when:+r.when||0,tries:r.tries==null||r.tries===""?null:+r.tries,result:/^s/i.test(str(r.result))?"Sent":/^r/i.test(str(r.result))?"Rested":"Fell",rests:r.rests==null||r.rests===""?null:+r.rests,type:normType(r.type),climber:str(r.climber),gym:str(r.gym),grade:str(r.grade)})),
    notes:(st.notes||[]).map(r=>Object.assign({},r,{project:str(r.project),climber:str(r.climber),when:+r.when||0,note:str(r.note)})),
    projects:(st.projects||[]).map(r=>Object.assign({},r,{type:normType(r.type),sentBy:Array.isArray(r.sentBy)?r.sentBy:str(r.sentBy).split(",").map(s=>s.trim()).filter(Boolean),status:/^s/i.test(str(r.status))?"Sent":/^r/i.test(str(r.status))?"Reset":"Open",added:+r.added||0,updated:+r.updated||0}))
  };
}
async function flush(){
  if(auth!=="ok")return;
  if(inflight){clearTimeout(flushT);flushT=setTimeout(flush,400);return;}
  clearTimeout(retryT);
  const ops=queue.slice();inflight=true;setSync(ops.length?"saving":ready?"loading":"connecting");
  let res;
  try{res=await callApi({key:KEY,ops});}catch(e){res={ok:false,error:"network"};}
  inflight=false;
  if(res&&res.ok){
    queue=queue.slice(ops.length);
    if(res.sheetUrl){sheetUrl=res.sheetUrl;LS.set("sheet",sheetUrl);}
    S=normalize(res.state);queue.forEach(applyLocal);
    settleDefaults();
    const first=!ready;ready=true;lastSync=Date.now();setSync("ok");
    if(first){render();showShare();}else onData();
    if(queue.length){clearTimeout(flushT);flushT=setTimeout(flush,350);}
    return;
  }
  if(res&&res.error==="bad_key"){auth="need";setSync("off");render("That key didn't work. Get a fresh phone link from your sheet: Climb Buddy menu → Show app key and phone link.");return;}
  setSync("error");
  if(res&&res.message&&res.error!=="network")toast(res.message);
  else toast(ops.length?"Can't reach your sheet. Your climbs will save when you're back online.":"Can't reach your sheet. Tap the status to retry.");
  retryT=setTimeout(flush,15000);
}
function setSync(s){const el=$("#sync");if(!el)return;
  const t={connecting:"Connecting…",loading:"Refreshing…",saving:"Saving…",ok:"Synced "+new Date(lastSync).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}),error:"Offline · tap to retry",off:"Not connected"}[s];
  el.textContent=t;el.className="sync"+(s==="ok"?" on":s==="error"||s==="off"?" bad":"");}
let lastToday=todayKey();
document.addEventListener("visibilitychange",()=>{if(document.hidden||auth!=="ok")return;
  // Leave the app open overnight and it moves on to the new day (unless you were logging an older day)
  if(todayKey()!==lastToday){if(DAY===lastToday)DAY=todayKey();lastToday=todayKey();if(ready)render();}
  if(Date.now()-lastSync>15000)flush();});
setInterval(()=>{if(!document.hidden&&auth==="ok"&&!queue.length&&!inflight&&Date.now()-lastSync>60000)flush();},20000);
window.addEventListener("beforeunload",e=>{if(queue.length){e.preventDefault();e.returnValue="";}});

function settleDefaults(){
  const cs=climbers();if(!cs.includes(WHO)){WHO=cs[0];LS.set("who",WHO);}
  if(!GYM){GYM=gyms()[0]||"My gym";LS.set("gym",GYM);}
  if(!TYPES.some(t=>t.k===TYPE))TYPE="Bouldering";
  if(cs.length<2)BOTH=false;
}

/* ---------- whose view ----------
   One person is picked for Climb and Projects; Progress can also show Both, and the full map is always both.
   Swipe left/right (or tap) to switch. */
const canBoth=()=>tab==="progress"&&climbers().length>1;
const cur=()=>tab==="map"?"*":BOTH&&canBoth()?"*":WHO;
const whoOpts=()=>canBoth()?[...climbers(),"*"]:climbers();
function themeFor(w){
  if(w==="*")return"both";
  if(eqi(w,"Cecilia"))return"lav";if(eqi(w,"Gary"))return"green";
  return climbers().indexOf(w)%2?"lav":"green";
}
// Always dark (Gary's choice). The light colours are still defined below if that ever changes.
const isDark=()=>true;
const THEME_LIGHT={green:"#EDF5EB",lav:"#F3EFFA",both:"#F3F1EA"},THEME_DARK={green:"#0B1622",lav:"#150F2C",both:"#100E22"};
let THEME_HEX=THEME_LIGHT;
function applyTheme(){
  const dk=isDark(),root=document.documentElement;
  if(dk)root.dataset.dark="1";else delete root.dataset.dark;
  THEME_HEX=dk?THEME_DARK:THEME_LIGHT;RES_HEX=dk?RES_DARK:RES_LIGHT;Object.assign(MAPC,dk?MAP_DARK:MAP_LIGHT);MAP_INK=MAPC.ink;
  const k=themeFor(cur());root.dataset.who=k;
  if(dk)RES_HEX=Object.assign({},RES_DARK,{sent:CHART_SENT[k]});
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",THEME_HEX[k]);
}
function whoSeg(){
  const o=whoOpts();if(o.length<2)return"";
  const k=tab==="session"?DAY:todayKey(),when=k===todayKey()?"today":"on "+fmtShort(k);
  const sub=w=>{const a=dayClimbs(k,w==="*"?null:w),s=a.filter(c=>c.result==="Sent").length;
    return!a.length?`Not climbed ${when}`:s?`${s} sent ${when}`:`${a.length} ${a.length===1?"climb":"climbs"} ${when}`;};
  return`<div class="wseg${o.length>2?" n3":""}" role="group" aria-label="Whose climbs" style="--n:${o.length}">${o.map(w=>{const t=themeFor(w),c=PCOL[t];
    return`<button data-act="who" data-v="${esc(w)}" aria-pressed="${cur()===w}" class="${cur()===w?"hl":""}" style="--pc:${c[0]};--pcs:${c[1]}"><svg viewBox="0 0 32 32" aria-hidden="true">${AVATAR[t]}</svg><span class="nm"><b>${w==="*"?"Both":esc(w)}</b><small>${esc(sub(w))}</small></span></button>`;}).join("")}</div>`;
}
function setWho(v,dir){
  const prev=cur(),o=whoOpts();
  if(v==="*")BOTH=true;else{WHO=v;LS.set("who",WHO);BOTH=false;}
  LS.set("both",BOTH?"1":"");
  if(cur()===prev)return;
  if(dir==null)dir=o.indexOf(cur())>o.indexOf(prev)?1:-1;
  render();
  const v2=$("#view");v2.classList.remove("slide-l","slide-r");void v2.offsetWidth;v2.classList.add(dir>0?"slide-l":"slide-r");
}

/* While switching, the new person's colour sweeps across the screen as a soft gradient,
   the black highlight glides between names and the page drifts with your finger.
   p goes 0 → 1; dir +1 means the next person is coming in from the right. */
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function paintSwitch(target,dir,p){
  const o=whoOpts(),i=o.indexOf(cur()),j=o.indexOf(target);
  const from=THEME_HEX[themeFor(cur())],to=THEME_HEX[themeFor(target)];
  const e=-25+150*p;                    // where the soft edge sits, as % in from the side the new colour enters
  const g=`linear-gradient(${dir>0?270:90}deg,${to} ${(e-25).toFixed(1)}%,${from} ${(e+25).toFixed(1)}%)`;
  document.body.style.backgroundImage=g;const top=$(".top");if(top)top.style.backgroundImage=g;
  const seg=$("#view .wseg");
  if(seg)seg.querySelectorAll("button").forEach((b,k)=>b.classList.toggle("hl",k===(p>.5?j:i)));
  const v=$("#view");v.style.transform=`translateX(${(-dir*p*44).toFixed(1)}px)`;v.style.opacity=(1-.3*p).toFixed(3);
}
function clearSwitch(){
  document.body.style.backgroundImage="";const top=$(".top");if(top)top.style.backgroundImage="";
  const v=$("#view");v.style.transform="";v.style.opacity="";v.style.transition="";
}
let switchAnim=null;
function animateSwitch(target,dir,from,commit){
  cancelAnimationFrame(switchAnim);
  if(REDUCED){clearSwitch();if(commit)setWho(target,dir);return;}
  const to=commit?1:0,dur=Math.max(90,Math.abs(to-from)*240),t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/dur),ease=1-Math.pow(1-k,3);
    paintSwitch(target,dir,from+(to-from)*ease);
    if(k<1){switchAnim=requestAnimationFrame(step);return;}
    // land without the colour fading back through the old tint
    document.documentElement.classList.add("notrans");
    if(commit)setWho(target,dir);
    clearSwitch();
    requestAnimationFrame(()=>requestAnimationFrame(()=>document.documentElement.classList.remove("notrans")));
  };
  switchAnim=requestAnimationFrame(step);
}
function tapWho(v){
  if(v===cur())return;
  const o=whoOpts(),dir=o.indexOf(v)>o.indexOf(cur())?1:-1;
  animateSwitch(v,dir,0,true);
}
/* Projects belong to whoever has tried them; one person's view skips routes they've already sent */
// a project nobody has tried yet belongs to whoever added it (older ones without an owner show for everyone)
function triedBy(p,w){const t=Object.keys(projInfo(p).tries);return t.length?t.includes(w):!p.owner||p.owner===w;}
const openFor=(p,w)=>isOpen(p)&&(w==="*"||(triedBy(p,w)&&!p.sentBy.includes(w)));

/* ---------- derived ---------- */
const atGym=c=>eqi(c.gym,GYM);
const dayClimbs=(k,who)=>S.climbs.filter(c=>atGym(c)&&dayKey(c.when)===k&&(!who||c.climber===who));
const isOpen=p=>p.status==="Open";
const gymProjects=()=>S.projects.filter(p=>eqi(p.gym,GYM));
function projInfo(p){
  const cs=S.climbs.filter(c=>c.project===p.id);
  // Last tried comes from the climbs themselves (a project made today for yesterday's climb was tried yesterday)
  const tries={};let last=0;
  for(const c of cs){if(c.result!=="Sent")tries[c.climber]=(tries[c.climber]||0)+(c.tries||1);last=Math.max(last,c.when);}
  if(!last)last=p.added||0;
  for(const w of p.sentBy)if(!(w in tries))tries[w]=0;
  return{tries,last,climbs:cs};
}
function projName(p){return p.name||(p.hold?p.hold+" holds":"Route");}
// beta notes are each climber's own, newest first
const myNotes=(p,w)=>S.notes.filter(n=>n.project===p.id&&n.climber===w).sort((a,b)=>b.when-a.when);
function projWhere(p){return[p.type,p.area,p.anchor?"Anchor "+p.anchor:""].filter(Boolean).join(" · ");}

const PF=[["All","All"],["Bouldering","Boulder"],["Rope","Rope"]];

// Quick log from a project page: a try (fell or rested) or the send, for whoever is picked, on the day being logged
function projLog(p,res){
  const prev={sentBy:p.sentBy.slice(),status:p.status};
  const cid=store.add("climbs",Object.assign({when:whenFor(DAY),climber:WHO,type:p.type,grade:p.grade,result:res,gym:p.gym||GYM,area:p.area||"",anchor:p.anchor||"",hold:p.hold||"",tries:1,project:p.id},res==="Rested"?{rests:1}:{}));
  if(res==="Sent")markProjectSent(p,WHO);else store.update("projects",p.id,{});
  toast(res==="Sent"?`Sent! ${gradeLabel(p.grade)} logged for ${WHO}`:`Logged a try for ${WHO}`,[{label:"Undo",fn:()=>{store.del("climbs",cid);if(res==="Sent")store.update("projects",p.id,prev);}}]);
}

/* =====================================================================

/* Anchor ranges live in the Lists tab: List "Anchors", Value like "Upper: 1-43" or "Pit: 77-86, 87-109" */
function anchorRanges(){
  const out=[];
  for(const r of listRows("Anchors")){
    const m=String(r.value).match(/^(.+?)\s*:\s*(.+)$/);if(!m)continue;
    for(const part of m[2].split(",")){const n=part.match(/(\d+)\s*[-–]\s*(\d+)/)||part.match(/(\d+)/);if(n)out.push({area:m[1].trim(),lo:+n[1],hi:+(n[2]||n[1])});}
  }
  return out;
}
const anchorText=area=>anchorRanges().filter(r=>eqi(r.area,area)).map(r=>r.lo===r.hi?String(r.lo):r.lo+"–"+r.hi).join(", ");
function areaForAnchor(type,num){
  const allowed=areaRows(type).map(r=>r.value);
  const hit=anchorRanges().find(r=>num>=r.lo&&num<=r.hi&&allowed.some(a=>eqi(a,r.area)));
  if(hit)return hit.area;
  const w=HUB_MAP.anchorAreas.find(w=>num>=w.lo&&num<=w.hi&&allowed.some(a=>eqi(a,w.area)));
  return w?w.area:"";
}
/* Spot on the map for an anchor number: found by number on the drawn runs, spread along the wall between drawn numbers */
function anchorPoint(area,num){
  num=parseInt(num,10);if(!num)return null;
  for(const run of HUB_MAP.anchorRuns){
    const P=run.pts,known=P.map((p,i)=>[p[0],i]).filter(k=>k[0]!=null);
    if(num<known[0][0]||num>known[known.length-1][0])continue;
    let k=0;while(k<known.length-2&&num>known[k+1][0])k++;
    const[n0,i0]=known[k],[n1,i1]=known[k+1];
    const seg=[];let total=0;for(let i=i0+1;i<=i1;i++){const l=Math.hypot(P[i][1]-P[i-1][1],P[i][2]-P[i-1][2]);seg.push(l);total+=l;}
    let d=(n1===n0?0:(num-n0)/(n1-n0))*total,j=0;while(j<seg.length-1&&d>seg[j]){d-=seg[j];j++;}
    const a=P[i0+j],b=P[i0+j+1],f=seg[j]?d/seg[j]:0;
    const x=a[1]+(b[1]-a[1])*f,y=a[2]+(b[2]-a[2])*f,L=seg[j]||1,sd=run.side||1;
    // the number label sits out in front of the wall face
    return{x,y,nx:-sd*(b[2]-a[2])/L,ny:sd*(b[1]-a[1])/L,n:num};
  }
  return null;
}
function anchorPinSVG(pt,colour,big){
  const r=big?22:17,lx=pt.x+pt.nx*(r+30),ly=pt.y+pt.ny*(r+30);
  return`<g pointer-events="none"><circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="${r}" fill="${colour||"#C9C4B8"}" stroke="${MAP_INK}" stroke-width="5"/>`+
    `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="${big?30:24}" font-weight="700" fill="${MAP_INK}" stroke="${MAPC.floor}" stroke-width="8" paint-order="stroke">#${pt.n}</text></g>`;
}

/* One SVG for both the Map tab and the small pickers.
   o.type: only that type's walls are active (picker), o.sel: selected zone id or area, o.dots/o.heat: overlays */
function mapSVG(o){
  const M=HUB_MAP;o=o||{};
  let vb=[0,0,M.w,M.h];
  if(o.type){
    const xs=[],ys=[];
    for(const z of M.zones){if(z.type!==o.type)continue;for(const p of z.pts.split(" ")){const[a,b]=p.split(",").map(Number);xs.push(a);ys.push(b);}xs.push(z.lbl[0]);ys.push(z.lbl[1]);}
    if(xs.length){const pad=70;const x0=Math.max(0,Math.min(...xs)-pad),y0=Math.max(0,Math.min(...ys)-pad),x1=Math.min(M.w,Math.max(...xs)+pad),y1=Math.min(M.h,Math.max(...ys)+pad);vb=[x0,y0,x1-x0,y1-y0];}
  }
  const label=(item,bold,dim)=>{
    const fs=item.fs||34,lh=fs*1.15,[x,y]=item.lbl;const lines=item.lines.slice();
    if(item.anchors)lines.push(item.anchors);
    const y0=y-(lines.length-1)*lh/2;
    const tf=item.rot?` transform="rotate(-90 ${x} ${y})"`:"";
    return`<text x="${x}" y="${y0}" text-anchor="middle" dominant-baseline="middle" font-size="${fs}" font-weight="${bold?700:600}" fill="${MAP_INK}" opacity="${dim?.4:1}"${tf} pointer-events="none">${lines.map((l,i)=>`<tspan x="${x}" dy="${i?lh:0}"${item.anchors&&i===lines.length-1?` font-size="${fs*.8}" font-weight="500"`:""}>${esc(l)}</tspan>`).join("")}</text>`;
  };
  let s=`<svg viewBox="${vb.join(" ")}" xmlns="http://www.w3.org/2000/svg" font-family="DM Sans, system-ui, sans-serif" role="group" aria-label="Map of ${esc(M.gym)}">`;
  s+=`<rect x="12" y="18" width="1201" height="1377" fill="${MAPC.floor}"/>`;
  for(const f of M.features)if(f.pts)s+=`<polygon points="${f.pts}" fill="${f.dash?"none":MAPC.feat}" stroke="${MAPC.featEdge}" stroke-width="5" stroke-linejoin="round"${f.dash?' stroke-dasharray="14 10"':""}/>`;
  for(const z of M.zones){
    const active=!o.type||z.type===o.type;
    const sel=o.sel&&(o.sel===z.id||(o.type&&active&&eqi(o.sel,z.area)));
    let fill=TYPE_TINT[z.type];
    if(o.heat){const n=o.heat[z.id]||0;fill=n?`rgba(${o.heatRGB||MAPC.heat},${(.12+.42*n/o.heatMax).toFixed(2)})`:MAPC.off;}
    const name=`${z.area} (${z.type})`;
    s+=active?`<g class="zone${sel?" sel":""}" data-act="${o.act||(o.type?"pickArea":"mapSel")}" data-z="${z.id}" data-area="${esc(z.area)}" tabindex="0" role="button" aria-label="${esc(name)}" aria-pressed="${!!sel}"><polygon points="${z.pts}" fill="${fill}" stroke="${MAPC.edge[z.type]||MAP_INK}" stroke-width="5" stroke-linejoin="round"/></g>`
      :`<polygon points="${z.pts}" fill="${MAPC.off}" stroke="${MAPC.featEdge}" stroke-width="4" stroke-linejoin="round" opacity=".45" aria-hidden="true"/>`;
  }
  s+=`<rect x="12" y="18" width="1201" height="1377" fill="none" stroke="${MAPC.wall}" stroke-width="12"/>`;
  if(!o.noLabels){for(const f of M.features)s+=label(f,false,!!o.type);
  for(const z of M.zones){
    const active=!o.type||z.type===o.type;
    const sel=o.sel&&(o.sel===z.id||(o.type&&active&&eqi(o.sel,z.area)));
    const anchors="";
    s+=label(Object.assign({},z,{anchors:anchors?"#"+anchors:""}),sel,!active);
  }}
  if(o.dots)for(const z of M.zones){
    const list=o.dots[z.id];if(!list||!list.length)continue;
    const show=list.slice(0,list.length>6?5:6),per=3,sp=44;
    show.forEach((c,i)=>{const row=Math.floor(i/per),col=i%per,n=Math.min(per,show.length-row*per);
      const x=z.pin[0]+(col-(n-1)/2)*sp,y=z.pin[1]+row*sp-((Math.ceil(show.length/per)-1)*sp)/2;
      s+=`<circle cx="${x}" cy="${y}" r="17" fill="${c||"#C9C4B8"}" stroke="${MAP_INK}" stroke-width="5" pointer-events="none"/>`;});
    if(list.length>6){const i=5,row=Math.floor(i/per),col=i%per;const x=z.pin[0]+(col-1)*sp,y=z.pin[1]+row*sp-sp/2;
      s+=`<circle cx="${x}" cy="${y}" r="21" fill="${MAP_INK}" pointer-events="none"/><text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="${MAPC.chip}" pointer-events="none">+${list.length-5}</text>`;}
  }
  if(o.pins)for(const p of o.pins)s+=anchorPinSVG(p.pt,p.colour,p.big);
  if(o.heat&&!o.noNums)for(const z of M.zones){const n=o.heat[z.id];if(!n)continue;
    s+=`<circle cx="${z.pin[0]}" cy="${z.pin[1]}" r="26" fill="${MAPC.chip}" stroke="${MAP_INK}" stroke-width="4" pointer-events="none"/><text x="${z.pin[0]}" y="${z.pin[1]}" text-anchor="middle" dominant-baseline="central" font-size="24" font-weight="700" fill="${MAP_INK}" pointer-events="none">${n}</text>`;}
  // open-project flags sit on the wall, nudged off the climb count when both show
  if(o.flags)for(const z of M.zones){if(!o.flags[z.id])continue;const off=o.heat&&o.heat[z.id]&&!o.noNums?50:0,x=z.pin[0]+off,y=z.pin[1]-off;
    s+=`<g pointer-events="none"><circle cx="${x}" cy="${y}" r="36" fill="${o.flagCol||"#3DC2EC"}" stroke="${MAPC.floor}" stroke-width="7"/><path d="M${x-8} ${y+18}V${y-18}L${x+15} ${y-9}L${x-8} ${y}" fill="#08202C" stroke="#08202C" stroke-width="5" stroke-linejoin="round"/></g>`;}
  return s+`</svg>`;
}
/* Small map shown in a details panel: tap a wall to fill in Where */
function miniSVG(type,area,anchor){
  const pt=typeOf(type).anchor&&area&&anchor?anchorPoint(area,anchor):null;
  return mapSVG({type,sel:area||"",pins:pt?[{pt,colour:"#3DC2EC",big:true}]:null});
}
function miniMap(type,gym,area,anchor){
  if(!eqi(gym,HUB_MAP.gym)||!HUB_MAP.zones.some(z=>z.type===type))return"";
  return`<div class="minimap" data-type="${esc(type)}" aria-label="Tap a wall to choose where">${miniSVG(type,area,anchor)}</div><p class="hint" style="margin-top:-8px">Tap a wall on the map, or pick it below.${typeOf(type).anchor?" An anchor number shows roughly where it is on the wall.":""}</p>`;
}
function syncMini(){
  const root=$("#sheetBody");if(!root)return;const mm=root.querySelector(".minimap");if(!mm)return;
  const ch=root.querySelector('input[name=area]:checked')||root.querySelector('input[name=area]:not([type=radio])');

/* Map tab */
let wallHist=false,mapSel=LS.get("mapsel",""),mapPer=LS.get("mapper","day"),mapAnchor="",mapZoom=+LS.get("mapz","1")||1;
// Opening the full map always lands on Day at the latest session
function mapLand(){mapPer="day";mapAnchor="";wallHist=false;LS.set("mapper",mapPer);}
if(tab==="map")mapLand();
const weekStart=k=>shiftDay(k,-((keyDate(k).getDay()+6)%7));
/* Activity period for whoever is shown: Day steps through session days only, Week is Monday to Sunday,
   Month is a calendar month. mapAnchor is a day key inside the period. null when they've never climbed here. */
function mapPeriod(w){
  const all=S.climbs.filter(c=>atGym(c)&&(w==="*"||c.climber===w));
  const days=[...new Set(all.map(c=>dayKey(c.when)))].sort();
  if(!days.length)return null;
  const today=todayKey(),first=days[0],last=days[days.length-1],thisYr=k=>k.slice(0,4)===today.slice(0,4);
  if(!mapAnchor||(mapPer==="day"&&!days.includes(mapAnchor)))mapAnchor=last;
  const a=mapAnchor;let from,to,label,canPrev,canNext,word,isLast=false;
  if(mapPer==="week"){
    from=weekStart(a);to=shiftDay(from,6);const f=keyDate(from),t=keyDate(to);
    label=fmtShort(from)+" – "+(f.getMonth()===t.getMonth()?t.getDate():fmtShort(to))+(thisYr(to)?"":", "+to.slice(0,4));
    canPrev=first<from;canNext=to<today;word=from<=today&&today<=to?"this week":"that week";
  }else if(mapPer==="month"){
    const m=a.slice(0,7),nx=keyDate(m+"-01");nx.setMonth(nx.getMonth()+1);
    from=m+"-01";to=shiftDay(dayKey(nx.getTime()),-1);
    label=keyDate(from).toLocaleDateString([],{month:"long",year:thisYr(from)?undefined:"numeric"});
    canPrev=first<from;canNext=m<today.slice(0,7);word="in "+label;
  }else{
    const i=days.indexOf(a);from=to=a;isLast=i===days.length-1;
    label=keyDate(a).toLocaleDateString([],{weekday:"short",month:"short",day:"numeric",year:thisYr(a)?undefined:"numeric"});
    canPrev=i>0;canNext=!isLast;word=a===today?"today":"that day";
  }
  const inP=c=>{const k=dayKey(c.when);return k>=from&&k<=to;};
  return{days,from,to,label,canPrev,canNext,word,isLast,inP,list:all.filter(inP),sessions:days.filter(k=>k>=from&&k<=to).length};
}
function mapStep(d){
  const P=mapPeriod("*");if(!P||!(d<0?P.canPrev:P.canNext))return;
  if(mapPer==="day")mapAnchor=P.days[P.days.indexOf(mapAnchor)+d];
  else if(mapPer==="week")mapAnchor=shiftDay(mapAnchor,7*d);
  else{const m=keyDate(mapAnchor.slice(0,7)+"-01");m.setMonth(m.getMonth()+d);mapAnchor=dayKey(m.getTime());}
  render();
}
function setMapPer(v){
  const P=mapPeriod("*");
  // back to Day: the latest session inside the period being looked at, else the first one
  if(v==="day"&&P&&mapPer!=="day")mapAnchor=P.days.filter(k=>k<=P.to).pop()||P.days[0];
  mapPer=v;LS.set("mapper",v);render();
}
const FLAG_SVG=`<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#3DC2EC"/><path d="M9 18V6l8 3-8 3" fill="#08202C" stroke="#08202C" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
/* Full map: always both climbers. Walls glow with the period's climbs, flags mark open projects; tap a wall for its panel */
function renderMap(){
  $("#title").textContent="Full map";
  const M=gymMap(),back=`<button class="btn ghost" data-tab="session">${ICON.left}Climb</button>`;
  if(!M){$("#view").innerHTML=`${back}<div class="empty"><strong>No map for ${esc(GYM)} yet</strong>The map is drawn for The Hub Mississauga. Switch gyms from the top of the screen.</div>`;return;}
  const P=mapPeriod("*");
  const o={heat:{},heatMax:1,flags:{}};
  if(P)for(const z of M.zones){const n=zoneClimbs(z).filter(P.inP).length;if(n){o.heat[z.id]=n;o.heatMax=Math.max(o.heatMax,n);}}
  for(const z of M.zones)if(zoneProjects(z).length)o.flags[z.id]=1;
  const sel=mapSel?zoneById(mapSel):null;
  if(sel)o.sel=sel.id;
  $("#view").innerHTML=`
    ${back}
    ${!P?`<div class="empty"><strong>No climbs here yet</strong>Log a session and your climbs will light up the walls.</div>`:`
    <div class="chips" role="group" aria-label="Period">${[["day","Day"],["week","Week"],["month","Month"]].map(([v,l])=>`<button class="chip" data-act="mapPer" data-v="${v}" aria-pressed="${mapPer===v}">${l}</button>`).join("")}</div>
    <div class="pnav"><button class="iconbtn" data-act="mapStep" data-d="-1" aria-label="Previous ${mapPer}" ${P.canPrev?"":"disabled"}>${ICON.left}</button><div class="pl"><b>${esc(P.label)}</b><small>${mapPer==="day"?(P.isLast?"Last session · ":""):P.sessions?`${P.sessions} ${P.sessions===1?"session":"sessions"} · `:""}${P.list.length} ${P.list.length===1?"climb":"climbs"}</small></div><button class="iconbtn" data-act="mapStep" data-d="1" aria-label="Next ${mapPer}" ${P.canNext?"":"disabled"}>${ICON.right}</button></div>`}
    <div class="maprow"><div class="mlegend">${P?`<span><i style="background:rgba(${MAPC.heat},.5)"></i>Glow = climbs ${esc(P.word)}</span>`:""}<span class="fl">${FLAG_SVG}Flag = open project</span></div>
      <div class="zoombtns"><button data-act="mapZoom" data-d="-1" aria-label="Zoom out" ${mapZoom<=1?"disabled":""}>−</button><button data-act="mapZoom" data-d="1" aria-label="Zoom in" ${mapZoom>=3?"disabled":""}>+</button></div></div>

}
function zonePanel(z,P){
  const rope=!!typeOf(z.type).anchor,anchors=rope?anchorText(z.area):"";
  const cs=zoneClimbs(z),inP=P?cs.filter(P.inP):[],ps=zoneProjects(z);
  const cnt=(a,r)=>a.filter(c=>c.result===r).length;
  const parts=RES_KEYS.map(([r,k,l])=>({k,l:l.toLowerCase(),v:cnt(inP,r)}));
  const top=hardest(inP),people=climbers().filter(w=>cs.some(c=>c.climber===w));
  return`<section class="panel" aria-labelledby="zoneTitle">
    <div class="phead2"><h2 id="zoneTitle" style="font-family:var(--f-display);font-size:21px">${esc(z.area)}</h2><span class="hsm">${z.type}${anchors?" · anchors "+esc(anchors):""}</span></div>
    ${rope&&!anchors?`<p class="hint">Anchor numbers not set yet. Add them in the Lists tab as <b>Anchors</b>, e.g. “${esc(z.area)}: 1-20”.</p>`:""}
    ${inP.length?`<span class="sbar" style="height:10px" role="img" aria-label="${parts.map(p=>p.v+" "+p.l).join(", ")}">${parts.filter(p=>p.v).map(p=>`<i style="flex:${p.v};background:${RES_HEX[p.k]}"></i>`).join("")}</span>
    <p class="hint" style="margin:0">${inP.length} ${inP.length===1?"climb":"climbs"} ${esc(P.word)} · ${parts[0].v} sent${top?" · hardest "+esc(top):""}</p>`:`<p class="hint" style="margin:0">No climbs here ${P?esc(P.word):"yet"}.</p>`}
    ${z.any?"":`<h3 class="sech">Open projects (${ps.length})</h3>
    ${ps.length?`<div class="wprojs">${ps.map(p=>{const tries=Object.values(projInfo(p).tries).reduce((a,b)=>a+b,0);
      return`<button class="wrow" data-act="openProj" data-id="${p.id}">${holdDot(p.hold,"sm")}${tagHTML(p.type,p.grade,"sm")}<span class="t">${esc(projName(p))}${p.anchor?" · #"+esc(p.anchor):""}</span><span class="hsm">${tries} ${tries===1?"try":"tries"}</span></button>`;}).join("")}</div>`:`<p class="hint" style="margin:0">None here right now.</p>`}`}
    <div class="foot"><button class="btn primary wide" data-act="logHere" data-z="${z.id}">Log a climb here</button><button class="btn" data-act="wallHist" aria-expanded="${wallHist}">Wall history</button></div>
    ${!wallHist?"":people.length?`<table class="ctable"><thead><tr><th scope="col">All time</th><th scope="col">Climbs</th><th scope="col">Sent</th>${rope?`<th scope="col">Rested</th>`:""}<th scope="col">Fell</th><th scope="col">Hardest</th></tr></thead><tbody>${people.map(w=>{const a=cs.filter(c=>c.climber===w);return`<tr><td><b>${esc(w)}</b></td><td>${a.length}</td><td>${cnt(a,"Sent")}</td>${rope?`<td>${cnt(a,"Rested")}</td>`:""}<td>${cnt(a,"Fell")}</td><td>${esc(hardest(a)||"—")}</td></tr>`;}).join("")}</tbody></table>`:`<p class="hint">No climbs logged on this wall yet.</p>`}
    ${z.any?"":`<button class="btn" data-act="zoneReset" data-z="${z.id}" ${ps.length?`data-confirm="Tap again: move ${ps.length} to Reset"`:"disabled"}>This wall was reset</button>`}
  </section>`;
}

/* Progress */
function renderProgress(){
  $("#title").textContent="Progress";
  const cs=climbers(),pWho=cur();
  const inMonth=S.climbs.filter(c=>atGym(c)&&dayKey(c.when).slice(0,7)===pMonth);
  const data=pWho==="*"?inMonth:inMonth.filter(c=>c.climber===pWho);
  const days=[...new Set(data.map(c=>dayKey(c.when)))].sort();
  const sent=data.filter(c=>c.result==="Sent").length,rested=data.filter(c=>c.result==="Rested").length,fell=data.length-sent-rested;
  const thisMonth=todayKey().slice(0,7);
  const mLabel=keyDate(pMonth+"-01").toLocaleDateString([],{month:"long",year:pMonth.slice(0,4)===thisMonth.slice(0,4)?undefined:"numeric"});
  const per=days.map(k=>{const d=data.filter(c=>dayKey(c.when)===k);const s=d.filter(c=>c.result==="Sent").length,r=d.filter(c=>c.result==="Rested").length;return{k,s,r,f:d.length-s-r,t:d.length,top:hardest(d)};});
  const max=Math.max(1,...per.map(x=>x.t));const H=140;
  let html=`
    ${whoSeg()}
    <div class="monthrow">
      <div class="month"><button class="iconbtn" data-act="month" data-d="-1" aria-label="Previous month">${ICON.left}</button><span>${esc(mLabel)}</span><button class="iconbtn" data-act="month" data-d="1" aria-label="Next month" ${pMonth>=thisMonth?"disabled":""}>${ICON.right}</button></div>
    </div>`;
  if(!data.length){$("#view").innerHTML=html+`<div class="empty"><strong>No climbs in ${esc(mLabel)}</strong>Log a session and it shows up here.</div>`+sheetLink();return;}
  if(pWho==="*"&&cs.length>1){
    html+=`<div class="panel"><table class="ctable"><thead><tr><th scope="col">${esc(mLabel)}</th><th scope="col">Sessions</th><th scope="col">Climbs</th><th scope="col">Sent</th><th scope="col">Hardest</th></tr></thead><tbody>${cs.map(w=>{const d=inMonth.filter(c=>c.climber===w);const s=d.filter(c=>c.result==="Sent").length;return`<tr><td><b>${esc(w)}</b></td><td>${new Set(d.map(c=>dayKey(c.when))).size}</td><td>${d.length}</td><td>${d.length?Math.round(s/d.length*100)+"%":"—"}</td><td>${esc(hardest(d)||"—")}</td></tr>`;}).join("")}</tbody></table></div>`;
  }else{
    html+=`<div class="kpis">
      <div class="kpi"><b>${days.length}</b><span>${days.length===1?"session":"sessions"}</span></div>
      <div class="kpi"><b>${data.length}</b><span>climbs · ${sent} sent, ${rested?rested+" rested, ":""}${fell} fell</span></div>
      <div class="kpi"><b>${Math.round(sent/data.length*100)}%</b><span>send rate</span></div>
      <div class="kpi"><b class="small">${esc(hardest(data)||"—")}</b><span>hardest sends</span></div>
    </div>`;
  }
  html+=`<section class="panel"><div class="phead2"><h2>Climbs per session</h2><div class="legend"><span><i style="background:var(--chart-sent,var(--sent))"></i>Sent</span>${rested?`<span><i style="background:var(--rest-bar)"></i>Rested</span>`:""}<span><i style="background:var(--fell-bar)"></i>Fell</span></div></div>
    <div class="chart" role="img" aria-label="${esc("Climbs per session: "+per.map(x=>fmtShort(x.k)+", "+x.t+" ("+x.s+" sent)").join("; "))}">${per.map(x=>`<div class="bar"><span class="v">${x.t}</span><span class="stack">${x.f?`<i style="height:${Math.round(x.f/max*H)}px;background:var(--fell-bar)"></i>`:""}${x.r?`<i style="height:${Math.round(x.r/max*H)}px;background:var(--rest-bar)"></i>`:""}${x.s?`<i style="height:${Math.round(x.s/max*H)}px;background:var(--chart-sent,var(--sent))"></i>`:""}</span><span class="d">${keyDate(x.k).getDate()}</span></div>`).join("")}</div></section>`;
  // sends by grade, per type
  let gb="";const bmax=Math.max(1,...TYPES.flatMap(t=>gradeCounts(t.k,data).map(r=>r.s)));
  for(const t of TYPES){const rows=gradeCounts(t.k,data);if(!rows.length)continue;
    gb+=`<div class="typeh">${t.k}</div>`+rows.map(r=>{const col=gradeColour(t.k,r.g)||"var(--ink)";return`<div class="gbar">${tagHTML(t.k,r.g,"sm")}<span class="track"><i style="width:${Math.round(r.s/bmax*100)}%;background:${col}"></i></span><span class="n"><b>${r.s}</b> sent${r.r?` · ${r.r} rest`:""}${r.f?` · ${r.f}✕`:""}</span></div>`;}).join("");}
  html+=`<section class="panel"><h2>Sends by grade</h2><div class="gbars">${gb}</div></section>`;
  html+=`<section><h2 class="sech">Sessions</h2><div class="slist">${per.slice().reverse().map(x=>`<button class="srow" data-act="openDay" data-k="${x.k}"><span class="dd"><small>${esc(fmtDow(x.k))}</small><b>${keyDate(x.k).getDate()}</b></span><span class="tx"><b>${x.t} ${x.t===1?"climb":"climbs"} · ${x.s} sent</b><span>${x.top?"Top "+esc(x.top):"No sends yet"}</span></span>${ICON.right}</button>`).join("")}</div></section>`+sheetLink();
  $("#view").innerHTML=html;
}
function gradeCounts(type,data){
  const d=data.filter(c=>c.type===type);if(!d.length)return[];
  const order=gradeRows(type).map(r=>r.value);
  for(const c of d)if(!order.some(g=>gkey(g)===gkey(c.grade)))order.push(c.grade);
  return order.map(g=>{const k=gkey(g);const x=d.filter(c=>gkey(c.grade)===k);return{g,s:x.filter(c=>c.result==="Sent").length,r:x.filter(c=>c.result==="Rested").length,f:x.filter(c=>c.result==="Fell").length};}).filter(r=>r.s+r.r+r.f);
}

/* =====================================================================

let sheet=null,lastFocus=null;
function openSheet(s){hideToast();if(!sheet)lastFocus=document.activeElement;sheet=s;renderSheet();$("#sheetWrap").hidden=false;document.body.style.overflow="hidden";setTimeout(()=>{const f=$("#sheetBody .close");if(f)f.focus();},30);}
function closeSheet(){sheet=null;$("#sheetWrap").hidden=true;document.body.style.overflow="";if(lastFocus&&lastFocus.isConnected)lastFocus.focus();}
const head=(title,sub)=>`<div class="sheet-h"><div><h2 id="sheetTitle">${title}</h2>${sub?`<p class="sub">${sub}</p>`:""}</div><button class="close" data-act="close" aria-label="Close">×</button></div>`;
function renderSheet(){
  if(!sheet)return;const b=$("#sheetBody");
  if(sheet.type==="climb"){if(sheet.id&&!S.climbs.some(x=>x.id===sheet.id)){closeSheet();return;}b.innerHTML=climbSheet();}
  else if(sheet.type==="project"){if(sheet.id&&!S.projects.some(x=>x.id===sheet.id)){closeSheet();return;}b.innerHTML=projSheet();}
  else if(sheet.type==="day")b.innerHTML=daySheet(sheet.k);

}

const anchorField=(type,val)=>typeOf(type).anchor?`<div class="inrow"><label for="fAnchor" class="flabel" style="margin:0">Anchor #</label><input id="fAnchor" name="anchor" inputmode="numeric" value="${esc(val||"")}" placeholder="—"></div>`:"";
/* One panel logs a new climb and edits an existing one; every field can change.
   The form lives in sheet.d (a draft) so tapping a button can redraw the panel without losing what was typed.
   A new climb is only stored on Save. */
function newClimb(type,area){
  TYPE=type;LS.set("type",type);
  openSheet({type:"climb",id:null,d:{type,result:"Sent",grade:"",climber:WHO,area:area||"",anchor:"",hold:"",tries:1,rests:1,videos:[],note:"",day:DAY,angle:"",problem:"",link:"",addProj:true}});
}
function editClimb(c){
  openSheet({type:"climb",id:c.id,d:{type:c.type,result:c.result,grade:c.grade,climber:c.climber,area:c.area||"",anchor:c.anchor==null?"":String(c.anchor),hold:c.hold||"",tries:c.tries||1,rests:c.rests||1,videos:videoLinks(c),note:c.note||"",day:dayKey(c.when),angle:c.angle==null?"":String(c.angle),problem:c.problem||"",link:c.project||"",addProj:false}});
