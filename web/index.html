  <form id="climbForm" data-id="${c.id}" autocomplete="off">
    <div class="inrow"><label for="fDay" class="flabel" style="margin:0">Date</label><input id="fDay" name="day" type="date" value="${dayKey(c.when)}" max="${todayKey()}" style="width:auto"></div>
    ${matches.length?`<fieldset><legend class="flabel">${res==="Sent"?"Did you send one of your projects?":"Is it one of your projects?"}</legend><div class="pills">${matches.map(p=>`<label class="pill"><input type="radio" name="link" value="${p.id}" ${sheet.link===p.id?"checked":""}><span>${holdDot(p.hold,"sm")}${esc(projName(p))}${p.area?" · "+esc(p.area):""}${p.anchor?" · #"+esc(p.anchor):""}</span></label>`).join("")}<label class="pill"><input type="radio" name="link" value="new" ${sheet.link==="new"?"checked":""}><span>${res==="Sent"?"No, another route":"A new route"}</span></label></div></fieldset>`:""}
    <div id="newFields" class="stack" ${sheet.link!=="new"?"hidden":""}>
      ${miniMap(c.type,c.gym||GYM,c.area,c.anchor)}
      ${areaField(c.type,c.area)}
      ${anchorField(c.type,c.anchor)}
      ${holdField(c.hold)}
    </div>
    ${res==="Rested"?stepField("restsOut","Rests needed",c.rests||1,1,"rest"):""}
    ${stepField("triesOut",res==="Sent"?"Tries it took":"Tries on it",c.tries||1,1,"try")}
    <label class="field">Note<input name="note" value="${esc(c.note||"")}" placeholder="${place}"></label>
    ${linked?`<p class="hint">Part of your project: ${esc(projName(linked))}${linked.area?" · "+esc(linked.area):""}.</p>`:res!=="Sent"&&c.type!=="Kilter Board"?`<label class="check" id="projCheck" ${sheet.link!=="new"?"hidden":""}><input type="checkbox" name="addProj" ${res==="Fell"?"checked":""}>${res==="Fell"?"Add to Projects to come back to":"Add to Projects to send it clean"}</label>`:""}
    <div class="foot"><button type="button" class="btn" data-act="${sheet.fresh?"skipDetails":"close"}">${sheet.fresh?"Skip details":"Cancel"}</button><button type="submit" class="btn primary">Save</button></div>
    <button type="button" class="linkbtn" data-act="delClimb" data-id="${c.id}" data-confirm="Tap again to delete">Delete this climb</button>
  </form>`;
}
function markProjectSent(p,who){
  const sentBy=[...new Set([...p.sentBy,who])];
  const all=Object.keys(projInfo(p).tries).every(w=>sentBy.includes(w));
  store.update("projects",p.id,{sentBy,status:all?"Sent":"Open"});
}
// Undo after saving: a new climb goes away; an edited one gets its old values back, and so does any project it touched
function undoSave(c,prev,fresh,keys,proj){
  return[{label:"Undo",fn:()=>{
    if(fresh)store.del("climbs",c.id);
    else{const back={};for(const k of keys)back[k]=prev[k]==null?"":prev[k];store.update("climbs",c.id,back);}
    if(proj&&proj.created)store.del("projects",proj.id);else if(proj&&proj.prev)store.update("projects",proj.id,proj.prev);
  }}];
}
function saveClimb(form){
  const c=S.climbs.find(x=>x.id===form.dataset.id);if(!c)return closeSheet();
  const prev=Object.assign({},c),fresh=!!(sheet&&sheet.fresh),lbl=gradeLabel(c.grade);
  const f=new FormData(form);
  const base={tries:Math.max(1,+$("#triesOut").textContent||1),note:String(f.get("note")||"").trim()};
  const ro=$("#restsOut");if(ro)base.rests=Math.max(1,+ro.textContent||1);
  const day=String(f.get("day")||"");
  if(day&&day!==dayKey(c.when)&&day<=todayKey())base.when=whenFor(day);
  const link=f.get("link")||"new";
  if(link!=="new"){
    const p=S.projects.find(x=>x.id===link)||{};
    const upd=Object.assign(base,{project:link,area:p.area||"",anchor:p.anchor||"",hold:p.hold||""});
    const proj=p.id?{id:p.id,prev:{sentBy:p.sentBy.slice(),status:p.status}}:null;
    store.update("climbs",c.id,upd);
    if(c.result==="Sent"&&p.id)markProjectSent(p,c.climber);else store.update("projects",link,{});
    closeSheet();toast(c.result==="Sent"?`Saved ${lbl}: project sent!`:`Saved ${lbl} to your project`,undoSave(c,prev,fresh,Object.keys(upd),proj));return;
  }
  const d=Object.assign(base,{area:String(f.get("area")||"").trim(),anchor:String(f.get("anchor")||"").trim(),hold:String(f.get("hold")||"")});
  let proj=null;
  if(c.project){const p=S.projects.find(x=>x.id===c.project);if(p)proj={id:p.id,prev:{area:p.area||"",anchor:p.anchor||"",hold:p.hold||""}};store.update("projects",c.project,{area:d.area,anchor:d.anchor,hold:d.hold});}
  else if(c.result!=="Sent"&&f.get("addProj")){
    d.project=store.add("projects",{type:c.type,grade:c.grade,hold:d.hold,area:d.area,anchor:d.anchor,gym:c.gym||GYM,note:d.note,status:"Open",sentBy:[],added:d.when||c.when||Date.now()});
    proj={id:d.project,created:true};
  }
  store.update("climbs",c.id,d);
  closeSheet();toast(d.project&&!c.project?`Saved ${lbl} to Projects`:`Saved ${lbl}`,undoSave(c,prev,fresh,Object.keys(d),proj));
}
function projSheet(p){
  const grades=gradeRows(p.type);const has=grades.some(r=>gkey(r.value)===gkey(p.grade));
  return head(`Edit project`,esc(p.type)+" · "+esc(p.gym||GYM))+`
  <form id="projForm" data-id="${p.id}" autocomplete="off">
    <label class="field">Grade<select name="grade">${grades.map(r=>`<option value="${esc(r.value)}" ${gkey(r.value)===gkey(p.grade)?"selected":""}>${esc(gradeLabel(r.value))}</option>`).join("")}${has?"":`<option selected>${esc(p.grade)}</option>`}</select></label>
    ${miniMap(p.type,p.gym||GYM,p.area,p.anchor)}
    ${areaField(p.type,p.area)}
    ${anchorField(p.type,p.anchor)}
    ${holdField(p.hold)}
    <label class="field">Note<input name="note" value="${esc(p.note||"")}"></label>
    <div class="foot"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">Save</button></div>
    <button type="button" class="linkbtn" data-act="delProj" data-id="${p.id}" data-confirm="Tap again to delete (your logged climbs stay)">Delete project</button>
  </form>`;
}
function daySheet(k){
  const list=dayClimbs(k).sort((a,b)=>a.when-b.when);
  const cs=[...new Set(list.map(c=>c.climber))];
  let body="";
  for(const w of cs){const mine=list.filter(c=>c.climber===w);const s=mine.filter(c=>c.result==="Sent").length;
    body+=`<h3 class="sech">${esc(w)} · ${mine.length} climbs · ${s} sent</h3>`+mine.map(c=>{const det=[c.hold?c.hold+" holds":"",c.area,c.anchor?"Anchor "+c.anchor:"",c.note?"“"+c.note+"”":""].filter(Boolean).join(" · ");
      return`<div class="crow">${resIcon(c.result)}${tagHTML(c.type,c.grade,"sm")}<button class="t" data-act="openClimb" data-id="${c.id}" style="appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit"><b style="display:flex;align-items:center;gap:6px">${catIcon(c.type)}<span class="res ${c.result==="Sent"?"s":c.result==="Rested"?"r":"f"}">${c.result}${c.result==="Rested"&&c.rests?" ×"+c.rests:""}</span> · ${esc(c.type)}</b>
<span>${esc(det||"Tap to add details")}</span></button><button class="x" data-act="delClimb" data-id="${c.id}" data-confirm="Delete?" aria-label="Delete this climb">×</button></div>`;}).join("");}
  return head(esc(fmtLong(k)),esc(GYM))+`<div class="stack">${body||`<div class="empty">No climbs on this day.</div>`}
    <button class="btn primary" data-act="logOnDay" data-k="${k}">${k===todayKey()?"Log more today":"Log more for this day"}</button></div>`;
}
function gymSheet(){
  return head("Gym","Climbs, projects and progress are kept per gym.")+`<div class="stack">
    <div class="pills" role="group" aria-label="Choose gym">${gyms().map(g=>`<button class="chip" data-act="setGym" data-v="${esc(g)}" aria-pressed="${eqi(g,GYM)}">${esc(g)}</button>`).join("")}</div>
    <form id="gymForm" style="display:flex;gap:8px;flex-direction:row" autocomplete="off"><label class="vh" for="gymInput">New gym</label><input id="gymInput" placeholder="Add a gym" style="flex:1"><button class="btn" type="submit">Add</button></form>
    <p class="hint">Grades and wall areas for each gym live in the Lists tab of your sheet.</p></div>`;
}

/* ---------- toast ---------- */
let tT=null,tActs=[];
function hideToast(){$("#toast").hidden=true;tActs=[];clearTimeout(tT);}
function toast(msg,acts){
  acts=acts||[];tActs=acts;$("#toastMsg").textContent=msg;
  $("#toastActs").innerHTML=acts.map((a,i)=>`<button data-i="${i}" class="${a.hi?"hi":""}">${esc(a.label)}</button>`).join("");
  $("#toast").hidden=false;clearTimeout(tT);tT=setTimeout(()=>{$("#toast").hidden=true;tActs=[];},acts.length?7000:2600);
}
$("#toastActs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=tActs[+b.dataset.i];$("#toast").hidden=true;tActs=[];if(a)a.fn();});

/* ---------- events ---------- */
function armed(btn){if(btn.dataset.armed==="1")return true;const orig=btn.innerHTML;btn.dataset.armed="1";btn.textContent=btn.dataset.confirm;setTimeout(()=>{if(btn.isConnected){btn.dataset.armed="";btn.innerHTML=orig;}},3200);return false;}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab]");if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){setTab(t.dataset.tab);return;}
  const a=t.dataset.act,id=t.dataset.id;
  if(t.dataset.confirm&&!armed(t))return;
  const P=id?S.projects.find(p=>p.id===id):null;
  switch(a){
    case"refreshNow":if(auth==="ok")flush();break;
    case"close":closeSheet();break;
    case"skipDetails":{const cid=sheet&&sheet.id;const c=S.climbs.find(x=>x.id===cid);closeSheet();if(c)toast(`${c.climber} ${resVerb(c)} a ${gradeLabel(c.grade)}`,[{label:"Undo",fn:()=>store.del("climbs",cid)}]);break;}
    case"who":tapWho(t.dataset.v);break;
    case"pick":openSheet({type:"pick",t:t.dataset.v,res:"Sent"});break;
    case"pickRes":if(sheet){sheet.res=t.dataset.v;renderSheet();}break;
    case"pickGrade":{if(!sheet)break;const s=sheet,w=homeWall();TYPE=s.t;LS.set("type",TYPE);logClimb(s.res||"Sent",t.dataset.g,w&&w.type===s.t?w.area:"");break;}
    case"homeWall":{const z=t.dataset.z;homeSel=!z||homeSel===z?"":z;LS.set("homesel",homeSel);render();break;}
    case"homeAll":homeAll=true;render();break;
    case"logHere":{const z=zoneById(t.dataset.z);if(!z)break;homeSel=z.id;LS.set("homesel",homeSel);setTab("session");openSheet({type:"pick",t:z.type,res:"Sent"});break;}
    case"wallHist":wallHist=!wallHist;render();break;
    case"prevDay":DAY=shiftDay(DAY,-1);render();break;
    case"nextDay":if(DAY<todayKey())DAY=shiftDay(DAY,1);render();break;
    case"goToday":DAY=todayKey();render();break;
    case"openDay":openSheet({type:"day",k:t.dataset.k});break;
    case"openClimb":openSheet({type:"climb",id});break;
    case"logOnDay":DAY=t.dataset.k;closeSheet();setTab("session");break;
    case"delClimb":{const c=S.climbs.find(x=>x.id===id);if(!c)break;const keep=Object.assign({},c);delete keep.id;store.del("climbs",id);if(sheet&&sheet.type==="climb")closeSheet();toast("Climb deleted",[{label:"Undo",fn:()=>enqueue({op:"add",coll:"climbs",id,data:keep})}]);break;}
    case"step":{const o=document.getElementById(t.dataset.o);if(o)o.textContent=Math.max(+t.dataset.min||0,(+o.textContent||0)+ +t.dataset.d);break;}
    case"pf":projFilter=t.dataset.v;render();break;
    case"editProj":openSheet({type:"project",id});break;
    case"projSent":if(P)projSent(P);break;
    case"projFell":if(P)projFell(P);break;
    case"projReset":if(P){store.update("projects",P.id,{status:"Reset"});toast("Moved to Reset",[{label:"Undo",fn:()=>store.update("projects",P.id,{status:"Open"})}]);}break;
    case"reopen":if(P){store.update("projects",P.id,{status:"Open"});toast("Back in your projects");}break;
    case"delProj":if(P){for(const c of S.climbs.filter(c=>c.project===P.id))store.update("climbs",c.id,{project:""});store.del("projects",P.id);closeSheet();toast("Project deleted");}break;
    case"month":{const d=keyDate(pMonth+"-01");d.setMonth(d.getMonth()+ +t.dataset.d);pMonth=dayKey(d.getTime()).slice(0,7);render();break;}
    case"mapPer":setMapPer(t.dataset.v);break;
    case"mapStep":mapStep(+t.dataset.d);break;
    case"mapZoom":mapZoom=Math.max(1,Math.min(3,mapZoom+ +t.dataset.d));LS.set("mapz",mapZoom);render();break;
    case"mapSel":{mapSel=mapSel===t.dataset.z?"":t.dataset.z;LS.set("mapsel",mapSel);const box=$("#mapbox"),sx=box?box.scrollLeft:0,sy=box?box.scrollTop:0;render();const nb=$("#mapbox");if(nb){nb.scrollLeft=sx;nb.scrollTop=sy;}const h=$("#zoneTitle");if(h)h.scrollIntoView({behavior:"smooth",block:"nearest"});break;}
    case"pickArea":{const root=$("#sheetBody");const radios=[...root.querySelectorAll('input[name=area][type=radio]')];const hit=radios.find(i=>eqi(i.value,t.dataset.area));
      if(hit)hit.checked=true;else{const ti=root.querySelector('input[name=area]:not([type=radio])');if(ti)ti.value=t.dataset.area;}syncMini();break;}
    case"zoneReset":{const z=zoneById(t.dataset.z);if(!z)break;const ps=zoneProjects(z);ps.forEach(p=>store.update("projects",p.id,{status:"Reset"}));
      toast(`${ps.length} ${ps.length===1?"project":"projects"} moved to Reset`,[{label:"Undo",fn:()=>ps.forEach(p=>store.update("projects",p.id,{status:"Open"}))}]);break;}
    case"pickGym":if(ready)openSheet({type:"gym"});break;
    case"setGym":GYM=t.dataset.v;LS.set("gym",GYM);closeSheet();render();toast("Now at "+GYM);break;
  }
});
document.addEventListener("click",e=>{if(e.target.id==="dayInput"&&e.target.showPicker){try{e.target.showPicker();}catch(_){}}});
document.addEventListener("input",e=>{
  // Typing an anchor number picks the wall it belongs to and pins roughly where it is on the map
  if(e.target.id==="fAnchor"){const n=parseInt(e.target.value,10);const form=e.target.form;if(!form)return;
    const c=form.id==="climbForm"?S.climbs.find(x=>x.id===form.dataset.id):S.projects.find(x=>x.id===form.dataset.id);
    const a=n&&c?areaForAnchor(c.type,n):"";
    const r=a?[...form.querySelectorAll('input[name=area][type=radio]')].find(i=>eqi(i.value,a)):null;if(r)r.checked=true;
    syncMini();}
});
document.addEventListener("change",e=>{
  if(e.target.name==="area"){syncMini();}
  if(e.target.id==="dayInput"){const v=e.target.value;if(v&&v<=todayKey()){DAY=v;render();}return;}
  if(e.target.name==="link"&&sheet&&sheet.type==="climb"){sheet.link=e.target.value;const nf=$("#newFields");if(nf)nf.hidden=sheet.link!=="new";const pc=$("#projCheck");if(pc)pc.hidden=sheet.link!=="new";}
});
document.addEventListener("submit",e=>{
  const id=e.target.id;e.preventDefault();
  if(id==="keyForm"){const k=$("#keyInput").value.trim();const u=API_URL||$("#apiInput").value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u.split(/[?#]/)[0])){render("That web app link doesn't look right. It starts with https://script.google.com and ends with /exec.");return;}
    if(!k)return;API=u.split(/[?#]/)[0];LS.set("api",API);KEY=k;LS.set("key",KEY);auth="ok";ready=false;render();flush();return;}
  if(id==="climbForm")saveClimb(e.target);
  if(id==="projForm"){const f=new FormData(e.target);store.update("projects",e.target.dataset.id,{grade:String(f.get("grade")||""),area:String(f.get("area")||"").trim(),anchor:String(f.get("anchor")||"").trim(),hold:String(f.get("hold")||""),note:String(f.get("note")||"").trim()});closeSheet();toast("Project saved");}
  if(id==="gymForm"){const v=$("#gymInput").value.trim();if(!v)return;if(!gyms().some(g=>eqi(g,v)))store.add("lists",{list:"Gym",value:v,colour:"",gym:""});GYM=v;LS.set("gym",GYM);closeSheet();render();toast("Now at "+v);}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet)closeSheet();
  // Map walls are SVG groups: let Enter and Space press them like buttons
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("zone")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}
});

/* ---------- swipe left/right to switch person ----------
   Ignored while a panel is open and on anything that scrolls sideways (zoomed map, long charts). */
let swipe=null;
function scrollsSideways(el){
  for(;el&&el!==document.body;el=el.parentElement){
    if(el.scrollWidth>el.clientWidth+2){const ox=getComputedStyle(el).overflowX;if(ox==="auto"||ox==="scroll")return true;}
  }
  return false;
}
// The screen follows your finger: past ~a third of the way (or a quick flick) it switches, otherwise it springs back
const dragP=dx=>Math.min(1,Math.abs(dx)/(Math.min(innerWidth,600)*.7));
document.addEventListener("touchstart",e=>{
  swipe=null;
  if(e.touches.length!==1||sheet||!ready||auth!=="ok"||tab==="map"||whoOpts().length<2)return;
  if(e.target.closest("#sheetWrap,#toast,.tabs,input,select,textarea")||scrollsSideways(e.target))return;
  cancelAnimationFrame(switchAnim);
  const p=e.touches[0];swipe={x:p.clientX,y:p.clientY,t:Date.now(),mode:"",dx:0};
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!swipe)return;const p=e.touches[0],dx=p.clientX-swipe.x,dy=p.clientY-swipe.y;
  if(!swipe.mode){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    swipe.mode=Math.abs(dx)>Math.abs(dy)*1.2?"h":"v";
    if(swipe.mode==="v"){swipe=null;return;}
  }
  if(e.cancelable)e.preventDefault();   // stop the page scrolling up and down while you swipe sideways
  swipe.dx=dx;const dir=dx<0?1:-1;
  if(swipe.dir&&swipe.dir!==dir)clearSwitch();
  swipe.dir=dir;
  paintSwitch(nextWho(dir),dir,dragP(dx));
},{passive:false});
document.addEventListener("touchend",e=>{
  if(!swipe||swipe.mode!=="h"){swipe=null;return;}
  const {dx,dir,t}=swipe;swipe=null;
  const fast=Math.abs(dx)>40&&Date.now()-t<250;
  animateSwitch(nextWho(dir),dir,dragP(dx),dragP(dx)>.35||fast);
},{passive:true});
document.addEventListener("touchcancel",()=>{if(swipe&&swipe.dir)animateSwitch(nextWho(swipe.dir),swipe.dir,dragP(swipe.dx),false);swipe=null;},{passive:true});

/* ---------- press feedback ----------
   Most taps redraw the screen, so the ring is replayed on the redrawn copy of the same button. */
const TAP_SEL="button,.chip,label.pill,label.sw,.zone,.srow,.phead";
const TAP_KEYS=["act","tab","v","id","res","g","z","d","k"];
let lastTap=null;
const tapTarget=el=>el.matches("label.pill,label.sw")?el.querySelector("span")||el:el;
function tapKey(el){const parts=TAP_KEYS.filter(k=>el.dataset[k]!=null).map(k=>`[data-${k}="${CSS.escape(el.dataset[k])}"]`);return parts.length?parts.join(""):null;}
function popTap(t){t.classList.remove("tapping","tapped");void t.offsetWidth;t.classList.add("tapped");setTimeout(()=>t.classList.remove("tapped"),450);}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(TAP_SEL);if(!el||el.disabled)return;
  const t=tapTarget(el);t.classList.add("tapping");
  const key=tapKey(el),root0=el.closest("#sheetWrap")||document;
  lastTap={el:t,key,nth:key?[...root0.querySelectorAll(key)].indexOf(el):0,inSheet:!!el.closest("#sheetWrap"),x:e.clientX,y:e.clientY,at:Date.now()};
},{passive:true});
document.addEventListener("pointermove",e=>{if(lastTap&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)>12){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
document.addEventListener("pointerup",()=>{if(!lastTap)return;popTap(lastTap.el);lastTap.at=Date.now();},{passive:true});
document.addEventListener("pointercancel",()=>{if(lastTap){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
function replayTap(){
  if(!lastTap||lastTap.el.isConnected||!lastTap.key||Date.now()-lastTap.at>600)return;
  const root=lastTap.inSheet?$("#sheetWrap"):document;
  const all=root?[...root.querySelectorAll(lastTap.key)]:[];const el=all[lastTap.nth]||all[0];if(el){const t=tapTarget(el);lastTap.el=t;popTap(t);}
}

/* ---------- phone Back button ----------
   Keeps one spare history entry (the "trap") on top of the page so Android's Back lands here instead of closing the app.
   Back closes an open panel, then returns to the Session tab, then asks for a second Back before closing.
   Chrome ignores entries added without a tap, so the trap is also re-added on the next touch. */
let exitArmed=0;
const trapped=()=>!!(history.state&&history.state.cbTrap);
function armBack(){if(!trapped())try{history.pushState({cbTrap:1},"");}catch(e){}}
window.addEventListener("popstate",()=>{
  if(trapped())return;
  if(sheet){if(sheet.fresh&&sheet.type==="climb")$("#sheetBody [data-act=skipDetails]")?.click();else closeSheet();armBack();return;}
  if(tab!=="session"){setTab("session");armBack();return;}
  if(Date.now()-exitArmed<2500)return;
  exitArmed=Date.now();toast("Press Back again to close Climb Buddy");
  setTimeout(()=>{if(Date.now()-exitArmed>=2500)armBack();},2600);
});
document.addEventListener("pointerdown",()=>{exitArmed=0;armBack();},true);

async function boot(){
  readLinkParams();
  armBack();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!API||!KEY)auth="need";
  render();
  if(auth==="ok")flush();else setSync("off");
}
boot();
})();
</script>
