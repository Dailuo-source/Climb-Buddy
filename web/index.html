// Copy what's typed into the draft (text fields, checked radios, video links, the project checkbox)
function readForm(){
  const f=$("#climbForm");if(!f||!sheet||!sheet.d)return;
  const d=sheet.d,fd=new FormData(f);
  for(const k of["area","anchor","hold","note","day","angle","problem","link"])if(f.querySelector(`[name="${k}"]`))d[k]=String(fd.get(k)||"").trim();
  d.videos=fd.getAll("video").map(v=>String(v).trim());
  if(f.querySelector('[name="addProj"]'))d.addProj=!!fd.get("addProj");
}
function setField(f,v,step){
  const d=sheet.d;
  if(f==="tries"||f==="rests"){d[f]=Math.max(1,(+d[f]||1)+(+step||0));return;}
  if(f==="type"){
    if(v===d.type)return;d.type=v;
    if(gradeIdx(v,d.grade)<0)d.grade="";
    if(d.result==="Rested"&&v!=="Top rope")d.result="Sent";
    if(v==="Kilter Board"){d.area="";d.anchor="";}
    else if(areaRows(v).length&&!areaRows(v).some(r=>eqi(r.value,d.area)))d.area="";
    if(!typeOf(v).anchor)d.anchor="";
    const p=d.link&&S.projects.find(x=>x.id===d.link);if(p&&p.type!==v)d.link="";
    return;
  }
  if(f==="result"&&v==="Rested"&&d.type!=="Top rope")return;
  if(f==="grade"){sheet.err="";const p=d.link&&S.projects.find(x=>x.id===d.link);if(p&&gkey(p.grade)!==gkey(v))d.link="";}
  if(f==="link")linkProject(v);
  d[f]=v;
}
// Linking a project fills in its wall and holds when the climb has none yet
function linkProject(id){
  const d=sheet.d,p=id&&S.projects.find(x=>x.id===id);d.link=id||"";
  if(p){if(!d.area&&p.area)d.area=p.area;if(!d.anchor&&p.anchor)d.anchor=String(p.anchor);if(!d.hold&&p.hold)d.hold=p.hold;}
}
const climbStep=(f,label,val,what)=>`<div class="inrow"><span class="flabel" style="margin:0">${label}</span><div class="stepper" role="group" aria-label="${label}"><button type="button" data-act="cf" data-f="${f}" data-d="-1" aria-label="One fewer ${what}">−</button><output>${val}</output><button type="button" data-act="cf" data-f="${f}" data-d="1" aria-label="One more ${what}">+</button></div></div>`;
function climbSheet(){
  const d=sheet.d,kil=d.type==="Kilter Board",isNew=!sheet.id;

  const who=climbers();
  const vids=d.videos;

    <fieldset><legend class="flabel">Result</legend><div class="resrow">${results.map(r=>`<button type="button" class="rbtn" data-act="cf" data-f="result" data-v="${r}" aria-pressed="${r===d.result}">${resIcon(r)}${r}</button>`).join("")}</div></fieldset>
    <fieldset><legend class="flabel">Grade</legend>${sheet.err==="grade"?`<p class="err" role="alert" style="margin:0 0 8px">Pick a grade first.</p>`:""}${grades.length?`<div class="gchips${d.grade?" picked":""}">${grades.map(g=>{const c=gradeColour(d.type,g),on=gkey(g)===gkey(d.grade);return`<button type="button" class="gchip" data-act="cf" data-f="grade" data-v="${esc(g)}" aria-pressed="${on}"${c?` style="background:${c};border-color:${c};color:${inkOn(c)}"`:""}>${esc(gradeLabel(g))}</button>`;}).join("")}</div>`:`<p class="hint">No grades yet. Add some to the Lists tab in your sheet (List: ${esc(typeOf(d.type).grades)}).</p>`}</fieldset>
    ${kil?`<div class="kgrid"><label class="field">Angle °<input name="angle" type="number" inputmode="numeric" min="0" max="70" step="5" value="${esc(d.angle)}" placeholder="40"></label><label class="field">Problem name<input name="problem" value="${esc(d.problem)}" placeholder="From the Kilter app"></label></div>`
      :`${miniMap(d.type,GYM,d.area,d.anchor)}${areaField(d.type,d.area)}${anchorField(d.type,d.anchor)}`}
    ${holdField(d.hold)}
    ${climbStep("tries",d.result==="Sent"?"Tries it took":"Tries on it",d.tries,"try")}

      <button type="button" class="btn small dashed" data-act="cvAdd">+ ${vids.length?"Add another link":"Add a video link"}</button></div></fieldset>

      :matches.length?`<fieldset><legend class="flabel">${d.result==="Sent"?"Did you send one of your projects?":"Is it one of your projects?"}</legend><div class="pills">${matches.map(p=>`<label class="pill"><input type="radio" name="link" value="${p.id}"><span>${holdDot(p.hold,"sm")}${esc(projName(p))}${p.area?" · "+esc(p.area):""}${p.anchor?" · #"+esc(p.anchor):""}</span></label>`).join("")}<label class="pill"><input type="radio" name="link" value="" checked><span>${d.result==="Sent"?"No, another route":"No, a new route"}</span></label></div></fieldset>`:""}

  </form>`;
}
function markProjectSent(p,who){
  const sentBy=[...new Set([...p.sentBy,who])];
  const all=Object.keys(projInfo(p).tries).every(w=>sentBy.includes(w));
  store.update("projects",p.id,{sentBy,status:all?"Sent":"Open"});
}
// Undo after saving: a new climb goes away; an edited one gets its old values back, and so does any project it touched
function undoSave(c,prev,fresh,keys,proj){

let swipe=null;
function scrollsSideways(el){
  for(;el&&el!==document.body;el=el.parentElement){
    if(el.scrollWidth>el.clientWidth+2){const ox=getComputedStyle(el).overflowX;if(ox==="auto"||ox==="scroll")return true;}

  if(!swipe.mode){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    swipe.mode=Math.abs(dx)>Math.abs(dy)*1.2?"h":"v";
    if(swipe.mode==="v"){swipe=null;return;}
  }
  if(e.cancelable)e.preventDefault();   // stop the page scrolling up and down while you swipe sideways
  swipe.dx=dx;const dir=dx<0?1:-1;
  if(swipe.dir&&swipe.dir!==dir)clearSwitch();
  swipe.dir=dir;
  paintSwitch(nextWho(dir),dir,dragP(dx));
},{passive:false});
document.addEventListener("touchend",e=>{
  if(!swipe||swipe.mode!=="h"){swipe=null;return;}
  const {dx,dir,t}=swipe;swipe=null;
  const fast=Math.abs(dx)>40&&Date.now()-t<250;
  animateSwitch(nextWho(dir),dir,dragP(dx),dragP(dx)>.35||fast);
},{passive:true});
document.addEventListener("touchcancel",()=>{if(swipe&&swipe.dir)animateSwitch(nextWho(swipe.dir),swipe.dir,dragP(swipe.dx),false);swipe=null;},{passive:true});

/* ---------- press feedback ----------
   Most taps redraw the screen, so the ring is replayed on the redrawn copy of the same button. */
const TAP_SEL="button,.chip,label.pill,label.sw,label.shrow,.zone,.srow,.phead";
const TAP_KEYS=["act","tab","f","v","id","res","g","z","d","k"];
let lastTap=null;
const tapTarget=el=>el.matches("label.pill,label.sw")?el.querySelector("span")||el:el;
function tapKey(el){const parts=TAP_KEYS.filter(k=>el.dataset[k]!=null).map(k=>`[data-${k}="${CSS.escape(el.dataset[k])}"]`);return parts.length?parts.join(""):null;}
function popTap(t){t.classList.remove("tapping","tapped");void t.offsetWidth;t.classList.add("tapped");setTimeout(()=>t.classList.remove("tapped"),450);}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest(TAP_SEL);if(!el||el.disabled)return;
  const t=tapTarget(el);t.classList.add("tapping");
  const key=tapKey(el),root0=el.closest("#sheetWrap")||document;
  lastTap={el:t,key,nth:key?[...root0.querySelectorAll(key)].indexOf(el):0,inSheet:!!el.closest("#sheetWrap"),x:e.clientX,y:e.clientY,at:Date.now()};
},{passive:true});
document.addEventListener("pointermove",e=>{if(lastTap&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)>12){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
document.addEventListener("pointerup",()=>{if(!lastTap)return;popTap(lastTap.el);lastTap.at=Date.now();},{passive:true});
document.addEventListener("pointercancel",()=>{if(lastTap){lastTap.el.classList.remove("tapping");lastTap=null;}},{passive:true});
function replayTap(){
  if(!lastTap||lastTap.el.isConnected||!lastTap.key||Date.now()-lastTap.at>600)return;
  const root=lastTap.inSheet?$("#sheetWrap"):document;
  const all=root?[...root.querySelectorAll(lastTap.key)]:[];const el=all[lastTap.nth]||all[0];if(el){const t=tapTarget(el);lastTap.el=t;popTap(t);}
}

/* ---------- phone Back button ----------
   Keeps one spare history entry (the "trap") on top of the page so Android's Back lands here instead of closing the app.
   Back closes an open panel, then returns to the Session tab, then asks for a second Back before closing.
   Chrome ignores entries added without a tap, so the trap is also re-added on the next touch. */
let exitArmed=0;
const trapped=()=>!!(history.state&&history.state.cbTrap);
function armBack(){if(!trapped())try{history.pushState({cbTrap:1},"");}catch(e){}}
window.addEventListener("popstate",()=>{
  if(trapped())return;
  if(sheet){closeSheet();armBack();return;}
  if(tab==="proj"){setTab("projects");armBack();return;}
  if(tab!=="session"){setTab("session");armBack();return;}
  if(Date.now()-exitArmed<2500)return;
  exitArmed=Date.now();toast("Press Back again to close Climb Buddy");
  setTimeout(()=>{if(Date.now()-exitArmed>=2500)armBack();},2600);
});
document.addEventListener("pointerdown",()=>{exitArmed=0;armBack();},true);

async function boot(){
  readLinkParams();
  readShare();
  armBack();
  if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!API||!KEY)auth="need";
  render();
  if(auth==="ok")flush();else setSync("off");
}
boot();
})();
</script>
